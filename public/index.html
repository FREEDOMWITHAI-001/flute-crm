      async saveCall(learnerId, batchId, phase) {
        const outcome = document.getElementById("call-outcome").value;
        const err = document.getElementById("call-error");
        if (!outcome) { err.textContent = "Pick an outcome."; return; }
        const btn = document.getElementById("call-save");
        btn.disabled = true;
        try {
          await apiFetch("POST", "/api/calls", {
            learnerId, batchId, phase, outcome,
            reason: document.getElementById("call-reason").value || null,
            followUp: document.getElementById("call-follow").value || null,
            note: document.getElementById("call-note").value || ""
          });
          document.getElementById("call-dialog").close();
          showToast("Call logged");
          invalidate("lists");
        } catch (e) {
          err.textContent = e.message || "Couldn't save the call.";
          btn.disabled = false;
        }
      },

      // ----- Auth -----
      toggleLoginPassword(btn) {
        const pw = document.getElementById("login-password");
        if (!pw) return;
        const show = pw.type === "password";
        pw.type = show ? "text" : "password";
        btn.textContent = show ? "Hide" : "Show";
        btn.setAttribute("aria-pressed", String(show));
        btn.setAttribute("aria-label", show ? "Hide password" : "Show password");
        pw.focus();
      },
      async doLogin() {
        if (state.login.busy) return;
        const email = (document.getElementById("login-email") || {}).value || "";
        const password = (document.getElementById("login-password") || {}).value || "";
        if (!email.trim() || !password) {
          state.login.error = "Enter your email and password.";
          render();
          return;
        }
        state.login = { busy: true, error: "" };
        render();
        try {
          await apiFetch("POST", "/api/auth/login", { email: email.trim(), password }, { allow401: true });
          state.login = { busy: false, error: "" };
          state.authRequired = false;
          resetStore();
          lastRouteKey = null;
          const pw = document.getElementById("login-password");
          if (pw) pw.value = "";
          render();
        } catch (e) {
          state.login = { busy: false, error: e.status === 401 ? "That email and password don't match an active account." : (e.message || "Couldn't sign in.") };
          render();
          const pw = document.getElementById("login-password");
          if (pw) { pw.focus(); pw.select(); }
        }
      },
      async signOut() {
        state.userMenuOpen = false;
        try { await apiFetch("POST", "/api/auth/logout", undefined, { allow401: true }); } catch (_) { /* signing out locally anyway */ }
        resetStore();
        state.user = null;
        state.authRequired = true;
        state.batchId = null;
        state.learnersFilter.selected.clear();
        render();
      },

      // ----- Sessions -----
      setSessionsView(v) { state.sessionsView = v; render(); },
      setSessFilter(k, v) { state.sessFilter = { ...state.sessFilter, [k]: v }; render(); },
      clearSessFilters() { state.sessFilter = { type: "All", status: "All", host: "All" }; render(); },
      sortSessions(key) {
        if (state.sessionsSort.key === key) state.sessionsSort.dir = state.sessionsSort.dir === "asc" ? "desc" : "asc";
        else { state.sessionsSort.key = key; state.sessionsSort.dir = key === "date" ? "asc" : "desc"; }
        render();
      },
      setSessionParticipantSearch(val) {
        state.sessionParticipantSearch = val;
        state.expandedParticipantIdx = null;
        render();
      },
      sortSessionParticipants(key) {
        if (state.sessionParticipantSort.key === key) state.sessionParticipantSort.dir = state.sessionParticipantSort.dir === "asc" ? "desc" : "asc";
        else { state.sessionParticipantSort.key = key; state.sessionParticipantSort.dir = key === "zoomName" || key === "firstJoinOffset" ? "asc" : "desc"; }
        state.expandedParticipantIdx = null;
        render();
      },
      toggleParticipantExpand(idx) {
        state.expandedParticipantIdx = state.expandedParticipantIdx === idx ? null : idx;
        render();
      },
      showAllParticipants() { state.sessionShowAll = true; render(); },

      // ----- Learners -----
      setLearnerFilter(key, val) {
        state.learnersFilter[key] = val;
        state.learnersLimit = LEARNER_PAGE;
        render();
      },
      resetLearnerFilters() {
        state.learnersFilter = { search: "", status: "All", regular: "All", missedTwice: "All", sortKey: "regularityScore", sortDir: "desc", selected: new Set() };
        state.learnersLimit = LEARNER_PAGE;
        render();
      },
      sortLearners(key) {
        const f = state.learnersFilter;
        if (f.sortKey === key) f.sortDir = f.sortDir === "asc" ? "desc" : "asc";
        else { f.sortKey = key; f.sortDir = key === "name" ? "asc" : "desc"; }
        render();
      },
      toggleLearnerSelect(rowKey, checked) {
        if (checked) state.learnersFilter.selected.add(rowKey);
        else state.learnersFilter.selected.delete(rowKey);
        render();
      },
      toggleAllLearners(checked) {
        const list = window.__learnersFiltered || [];
        if (checked) list.forEach(l => state.learnersFilter.selected.add(l.rowKey));
        else state.learnersFilter.selected.clear();
        render();
      },
      showMoreLearners() { state.learnersLimit += LEARNER_PAGE; render(); },
      gotoLearnersPage(n) { state.learnersLimit = n * LEARNER_PAGE; render(); pageScroller().scrollTo({ top: 0 }); },
      gotoListsPage(n) { state.listsLimit = n * LIST_PAGE; render(); pageScroller().scrollTo({ top: 0 }); },
      gotoReviewPage(n) { state.reviewLimit = n * REVIEW_PAGE; render(); pageScroller().scrollTo({ top: 0 }); },
      copySelectedLearnerNumbers() {
        const list = window.__learnersFiltered || [];
        const sel = list.filter(l => state.learnersFilter.selected.has(l.rowKey));
        copyNumbers((sel.length ? sel : list).filter(l => !l.doNotContact).map(l => l.phone));
      },
      exportFilteredLearners() {
        const list = window.__learnersFiltered || [];
        const sel = list.filter(l => state.learnersFilter.selected.has(l.rowKey));
        const rows = sel.length ? sel : list;
        const b = state.batchId;
        exportCSV(
          `learners-batch-${b}.csv`,
          ["Name", "Phone", "Email", "Country", "Region", "Phase", "Status", "Weeks Attended", "Weeks Held", "Streak", "Total Minutes", "Regularity Score", "Regular", "Missed Twice", "Last Attended", "Do Not Contact"],
          rows.map(l => [l.name, l.phone, l.email, l.country, l.region, l.phase, l.status, l.weeksAttended, l.heldWeeks, l.currentStreak, l.totalMinutes, l.regularityScore, l.isRegular ? "Yes" : "No", l.isMissedTwice ? "Yes" : "No", l.lastAttended, l.doNotContact ? "Yes" : "No"])
        );
      },

      // ----- Lists -----
      setListsTab(id) { state.listsTab = id; state.listsSearch = ""; state.listsLimit = LIST_PAGE; render(); },
      setDiamondLimit(val) { state.diamondInviteLimit = Math.max(1, Math.floor(Number(val)) || 25); render(); },
      setListsSearch(val) { state.listsSearch = val; state.listsLimit = LIST_PAGE; render(); },
      showMoreListRows() { state.listsLimit += LIST_PAGE; render(); },
      copyCurrentListNumbers() {
        const d = window.__currentListData;
        if (!d) return;
        copyNumbers(d.rows.map(r => r.phone));
      },
      exportCurrentListCSV() {
        const d = window.__currentListData;
        if (!d) return;
        const file = `list-${d.tab.id}-batch-${state.batchId}.csv`;
        if (d.tab.zoomRows) {
          exportCSV(file,
            ["Zoom Name", "Zoom Email", "Phone", "Phase", "Sessions Attended", "Total Minutes", "Last Seen", "Note"],
            d.rows.map(r => [r.zoomName, r.zoomEmail, r.phone, r.phase, r.sessionsAttended, r.totalMinutes, r.lastSeen, r.note]));
        } else {
          exportCSV(file,
            ["Name", "Phone", "Email", "Country", "Region", "Phase", "Status", "Regularity Score", "Total Minutes", "Last Attended"],
            d.rows.map(l => [l.name, l.phone, l.email, l.country, l.region, l.phase, l.status, l.regularityScore, l.totalMinutes, l.lastAttended]));
        }
      },

      // ----- Review queue -----
      reviewSearchInput(idx, val) {
        const item = (window.__reviewItems || [])[idx];
        if (!item) return;
        const k = item.id;
        const st = state.reviewSearch[k] || (state.reviewSearch[k] = { q: "", results: null, loading: false, error: "", seq: 0, timer: null });
        st.q = val;
        clearTimeout(st.timer);
        const q = val.trim();
        st.seq++;
        if (q.length < 2) {
          st.results = null; st.loading = false; st.error = "";
          updateReviewResults(k);
          return;
        }
        st.loading = true;
        updateReviewResults(k);
        const mySeq = st.seq;
        st.timer = setTimeout(async () => {
          try {
            const res = await getJSON(`/api/learners/search?q=${encodeURIComponent(q)}`);
            if (st.seq !== mySeq) return;
            st.results = res.results || [];
            st.error = "";
          } catch (e) {
            if (st.seq !== mySeq) return;
            st.results = null;
            st.error = e.message || "Search failed";
          }
          st.loading = false;
          updateReviewResults(k);
        }, 250);
      },
      async resolveReview(idx, action, learnerId) {
        const item = (window.__reviewItems || [])[idx];
        if (!item || state.reviewBusy.has(item.id)) return;
        state.reviewBusy.add(item.id);
        render();
        try {
          const body = { identityKey: item.id, action };
          if (action === "match") body.learnerId = Number(learnerId);
          await apiFetch("POST", "/api/review/resolve", body);
          const cached = store.data.get("review:" + state.batchId);
          if (cached && Array.isArray(cached.items)) cached.items = cached.items.filter(x => x.id !== item.id);
          delete state.reviewSearch[item.id];
          showToast(action === "match" ? `Matched "${item.zoomName}" — remembered for future syncs` : action === "not_learner" ? `Marked "${item.zoomName}" as not a learner` : `Skipped "${item.zoomName}"`);
          invalidate("review", "overview", "learners", "learner", "lists", "bootstrap", "sessions", "session");
        } catch (e) {
          if (e.status !== 401) showToast(e.message || "Couldn't save that decision", "error");
        } finally {
          state.reviewBusy.delete(item.id);
          render();
        }
      },

      // ----- Sync -----
      async runSync(kind) {
        if (state.syncRunning[kind]) return;
        state.syncRunning[kind] = true;
        render();
        try {
          const res = await apiFetch("POST", "/api/sync/run", { source: kind });
          const boot = store.data.get("bootstrap");
          const sum = summarizeSyncResults(res && res.results, boot);
          showToast(sum.text, sum.error ? "error" : undefined);
        } catch (e) {
          if (e.status !== 401) showToast(e.message || "Sync failed", "error");
        } finally {
          state.syncRunning[kind] = false;
          invalidate(...ALL_DATA_KEYS);
        }
      },
      async importLearnersCsv(input) {
        const file = input && input.files && input.files[0];
        if (!file || state.importBusy) return;
        state.importBusy = true;
        state.importResult = null;
        render();
        try {
          const csv = await file.text();
          if (!csv.trim()) throw new ApiError(0, "That file is empty.");
          const res = await apiFetch("POST", "/api/learners/import", { csv, platform: "TagMango" });
          state.importResult = { fileName: file.name, inserted: res.inserted, updated: res.updated, skipped: res.skipped, errors: res.errors || [] };
          showToast(`Imported ${file.name}: ${fmtNum(res.inserted)} new · ${fmtNum(res.updated)} updated`);
          invalidate(...ALL_DATA_KEYS);
        } catch (e) {
          if (e.status !== 401) state.importResult = { fileName: file.name, error: e.message || "Import failed" };
        } finally {
          state.importBusy = false;
          try { input.value = ""; } catch (_) { /* ignore */ }
          render();
        }
      },
      copyWebhookUrl() {
        const s = store.data.get("settings");
        const url = s && s.tagmango && s.tagmango.webhookUrl;
        if (url) copyText(url, "Webhook URL copied");
      },

      // ----- Settings: rules -----
      saveRulesFromForm() {
        const rules = {};
        for (const f of RULE_FIELDS) {
          const elx = document.getElementById(f.id);
          const raw = elx ? elx.value.trim() : "";
          const n = Number(raw);
          if (raw === "" || !Number.isInteger(n) || n < f.min || n > f.max) {
            setFormMsg("rules", "error", `${f.label}: enter a whole number between ${f.min} and ${f.max}.`);
            if (elx) elx.focus();
            return;
          }
          rules[f.key] = n;
        }
        for (const g of RULE_TYPE_GROUPS) {
          rules[g.key] = Array.from(document.querySelectorAll(`input[name="${g.name}"]:checked`)).map(x => x.value);
          if (!rules[g.key].length) {
            setFormMsg("rules", "error", `${g.label}: pick at least one session type.`);
            return;
          }
        }
        setFormMsg("rules", null, "");
        runWrite("rules", () => apiFetch("PUT", "/api/settings/rules", { rules }), {
          after: () => setFormMsg("rules", "ok", "Rules saved — every screen now uses the new rules."),
          onError: msg => setFormMsg("rules", "error", msg),
          invalidates: ALL_DATA_KEYS
        });
      },
      resetDefaultRules() {
        RULE_FIELDS.forEach(f => { const elx = document.getElementById(f.id); if (elx) elx.value = DEFAULT_RULES[f.key]; });
        RULE_TYPE_GROUPS.forEach(g => {
          document.querySelectorAll(`input[name="${g.name}"]`).forEach(cb => { cb.checked = DEFAULT_RULES[g.key].includes(cb.value); });
        });
        window.saveRulesFromForm();
      },

      // ----- Settings: batches & meetings -----
      setConfirm(k) { state.confirm = k || null; render(); },
      addBatch() {
        const dateEl = document.getElementById("new-batch-date");
        const nameEl = document.getElementById("new-batch-name");
        const startDate = dateEl ? dateEl.value : "";
        if (!/^\d{4}-\d{2}-\d{2}$/.test(startDate)) {
          setFormMsg("add-batch", "error", "Pick the batch's start date.");
          if (dateEl) dateEl.focus();
          return;
        }
        const wd = weekdayOf(startDate);
        if (wd !== 0) {
          const prev = addDaysStr(startDate, -wd), next = addDaysStr(startDate, 7 - wd);
          setFormMsg("add-batch", "error", `Batches start on a Sunday — ${fmtDate(startDate)} is a ${WEEKDAY_NAMES[wd]}. Try ${fmtDate(prev)} or ${fmtDate(next)}.`);
          if (dateEl) dateEl.focus();
          return;
        }
        const name = nameEl ? nameEl.value.trim() : "";
        setFormMsg("add-batch", null, "");
        runWrite("add-batch", () => apiFetch("POST", "/api/batches", name ? { startDate, name } : { startDate }), {
          success: `Batch starting ${fmtDate(startDate)} added`,
          after: () => clearFields("new-batch-date", "new-batch-name"),
          onError: msg => setFormMsg("add-batch", "error", msg),
          invalidates: ALL_DATA_KEYS
        });
      },
      deleteBatch(id) {
        runWrite(`del-batch:${id}`, () => apiFetch("DELETE", `/api/batches/${Number(id)}`), {
          success: "Batch deleted",
          after: () => {
            state.confirm = null;
            const boot = store.data.get("bootstrap");
            if (boot && Array.isArray(boot.batches)) {
              boot.batches = boot.batches.filter(x => x.id !== id);
              if (boot.defaultBatchId === id) boot.defaultBatchId = boot.batches.length ? boot.batches[0].id : null;
            }
            if (state.batchId === id) state.batchId = null;
          },
          invalidates: ALL_DATA_KEYS
        });
      },
      openMeetingForm(batchId, slot, meetingId) {
        state.meetingForm = { batchId: Number(batchId), slot, meetingId: meetingId == null ? null : Number(meetingId) };
        state.confirm = null;
        delete state.formMsg.meeting;
        const fid = `${state.meetingForm.batchId}-${slot}-${meetingId == null ? "new" : Number(meetingId)}`;
        state.focusAfterRender = `mf-${fid}-ref`;
        render();
      },
      closeMeetingForm() { state.meetingForm = null; delete state.formMsg.meeting; render(); },
      saveMeetingForm() {
        const mf = state.meetingForm;
        if (!mf) return;
        const fid = `${mf.batchId}-${mf.slot}-${mf.meetingId == null ? "new" : mf.meetingId}`;
        const val = suffix => { const e = document.getElementById(`mf-${fid}-${suffix}`); return e ? e.value.trim() : ""; };
        const slot = val("slot") || mf.slot;
        const zoomAccount = val("account");
        const ref = val("ref");
        const startTime = val("start");
        const durRaw = val("duration");
        if (!zoomAccount) return setFormMsg("meeting", "error", "Choose the Zoom account that hosts this meeting.");
        if (!ref) return setFormMsg("meeting", "error", "Paste the Zoom meeting ID or the meeting / registration link.");
        if (startTime && !/^\d{2}:\d{2}$/.test(startTime)) return setFormMsg("meeting", "error", "Start time must look like 19:00.");
        const durationMin = durRaw ? Number(durRaw) : null;
        if (durRaw && (!Number.isInteger(durationMin) || durationMin < 1 || durationMin > 600)) return setFormMsg("meeting", "error", "Duration must be a whole number of minutes (1–600).");
        const body = { zoomAccount, ref };
        if (startTime) body.startTime = startTime;
        if (durationMin) body.durationMin = durationMin;
        setFormMsg("meeting", null, "");
        const isEdit = mf.meetingId != null;
        runWrite("meeting-form:" + fid, () => (isEdit
          ? apiFetch("PUT", `/api/meetings/${mf.meetingId}`, body)
          : apiFetch("POST", `/api/batches/${mf.batchId}/meetings`, { slot, ...body })), {
          success: isEdit ? "Meeting updated" : "Meeting linked",
          after: () => { state.meetingForm = null; },
          onError: msg => setFormMsg("meeting", "error", msg),
          invalidates: ALL_DATA_KEYS
        });
      },
      deleteMeeting(id) {
        runWrite(`del-meeting:${id}`, () => apiFetch("DELETE", `/api/meetings/${Number(id)}`), {
          success: "Meeting removed",
          after: () => { state.confirm = null; },
          invalidates: ALL_DATA_KEYS
        });
      },

      // ----- Settings: team -----
      addUser() {
        const v = id => { const e = document.getElementById(id); return e ? e.value.trim() : ""; };
        const name = v("nu-name"), email = v("nu-email"), role = v("nu-role"), password = (document.getElementById("nu-password") || {}).value || "";
        if (!name) return setFormMsg("add-user", "error", "Enter their name.");
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return setFormMsg("add-user", "error", "Enter a valid email address.");
        if (!ROLE_ACCESS[role]) return setFormMsg("add-user", "error", "Choose a role.");
        if (password.length < 8) return setFormMsg("add-user", "error", "The temporary password must be at least 8 characters.");
        setFormMsg("add-user", null, "");
        runWrite("add-user", () => apiFetch("POST", "/api/users", { name, email, role, password }), {
          after: () => {
            clearFields("nu-name", "nu-email", "nu-password");
            setFormMsg("add-user", "ok", `${name} added as ${role}. Share the temporary password with them privately.`);
          },
          onError: msg => setFormMsg("add-user", "error", msg),
          invalidates: ["settings"]
        });
      },
      changeUserRole(id, role) {
        runWrite("user:" + id, () => apiFetch("PUT", `/api/users/${Number(id)}`, { role }), {
          success: `Role changed to ${role}`,
          invalidates: ["settings"],
          onError: msg => { showToast(msg, "error"); invalidate("settings"); }
        });
      },
      setUserActive(id, active) {
        runWrite("user:" + id, () => apiFetch("PUT", `/api/users/${Number(id)}`, { active: !!active }), {
          success: active ? "User reactivated" : "User deactivated and signed out",
          invalidates: ["settings"]
        });
      },
      togglePwForm(id) {
        state.pwFormUser = state.pwFormUser === id || id == null ? null : Number(id);
        delete state.formMsg.pw;
        if (state.pwFormUser != null) state.focusAfterRender = `pw-${state.pwFormUser}`;
        render();
      },
      resetUserPassword(id) {
        const e = document.getElementById(`pw-${id}`);
        const password = e ? e.value : "";
        if (password.length < 8) return setFormMsg("pw", "error", "The password must be at least 8 characters.");
        setFormMsg("pw", null, "");
        runWrite("pw:" + id, () => apiFetch("PUT", `/api/users/${Number(id)}`, { password }), {
          success: "Password updated — they've been signed out everywhere",
          after: () => { clearFields(`pw-${id}`); state.pwFormUser = null; },
          onError: msg => setFormMsg("pw", "error", msg),
          invalidates: ["settings"]
        });
      },
      deleteUser(id) {
        runWrite(`del-user:${id}`, () => apiFetch("DELETE", `/api/users/${Number(id)}`), {
          success: "Team member deleted",
          after: () => { state.confirm = null; },
          invalidates: ["settings"]
        });
      },

      // ----- Settings: do-not-contact -----
      addDnc() {
        const ta = document.getElementById("dnc-values");
        const noteEl = document.getElementById("dnc-note");
        const values = ta ? ta.value : "";
        if (!values.trim()) return setFormMsg("dnc", "error", "Enter at least one email or phone number.");
        const note = noteEl ? noteEl.value.trim() : "";
        setFormMsg("dnc", null, "");
        runWrite("add-dnc", () => apiFetch("POST", "/api/dnc", note ? { values, note } : { values }), {
          after: res => {
            const added = Number(res && res.added) || 0;
            clearFields("dnc-values", "dnc-note");
            setFormMsg("dnc", added ? "ok" : "error", added ? `Added ${added} to do-not-contact.` : "Nothing new was added — entries were already listed or weren't a valid email / phone.");
          },
          onError: msg => setFormMsg("dnc", "error", msg),
          invalidates: ["settings", "learners", "learner", "lists", "overview", "bootstrap"]
        });
      },
      removeDnc(i) {
        const d = (window.__dncList || [])[i];
        if (!d) return;
        runWrite("dnc:" + d.key, () => apiFetch("DELETE", `/api/dnc/${encodeURIComponent(d.key)}`), {
          success: "Removed from do-not-contact",
          invalidates: ["settings", "learners", "learner", "lists", "overview", "bootstrap"]
        });
      },

      // ----- Settings: TagMango -----
      registerTagmangoWebhooks() {
        runWrite("tm-register", () => apiFetch("POST", "/api/tagmango/register-webhooks"), {
          after: res => {
            const results = (res && res.results) || [];
            const failed = Array.isArray(results) ? results.filter(r => r && r.ok === false) : [];
            if (Array.isArray(results) && results.length) {
              const text = results.map(r => `${r.event || "webhook"}: ${r.ok === false ? `failed${r.message ? ` (${r.message})` : ""}` : "registered"}`).join(" · ");
              setFormMsg("tagmango", failed.length ? "error" : "ok", text);
            } else {
              setFormMsg("tagmango", "ok", "Webhook registration sent to TagMango.");
            }
          },
          onError: msg => setFormMsg("tagmango", "error", msg),
          invalidates: ["settings", "sync"]
        });
      }
    });

    // Close user dropdown on outside click; Escape closes menus.
    document.addEventListener("click", e => {
      if (state.userMenuOpen && !e.target.closest(".user-menu-wrap")) {
        state.userMenuOpen = false;
        render();
      }
    });
    document.addEventListener("keydown", e => {
      if (e.key !== "Escape") return;
      if (state.userMenuOpen) { state.userMenuOpen = false; render(); }
      else if (state.mobileMenuOpen) { state.mobileMenuOpen = false; render(); }
    });

    window.addEventListener("hashchange", () => {
      state.expandedParticipantIdx = null;
      state.sessionShowAll = false;
      state.sessionParticipantSearch = "";
      state.confirm = null;
      state.meetingForm = null;
      state.pwFormUser = null;
      state.mobileMenuOpen = false;
      render();
    });

    // Keep "12 min ago"-style labels fresh without re-rendering the page.
    setInterval(() => {
      document.querySelectorAll("[data-reltime]").forEach(elx => {
        const iso = elx.getAttribute("data-reltime");
        if (!iso) return;
        elx.textContent = (elx.getAttribute("data-prefix") || "") + relTime(iso);
      });
    }, 60_000);

    // Boot
    document.documentElement.setAttribute("data-theme", state.theme);
    if (!window.location.hash) {
      history.replaceState(null, "", "#/overview");
    }
    render();

  </script>
</body>
</html>
