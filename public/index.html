<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flute Gandharvas CRM — Hackathon Attendance &amp; Retention</title>
  <meta name="description" content="Hackathon Attendance &amp; Retention CRM module for Flute Gandharvas — tracking 14-week live Zoom cohorts, TagMango learner matching, retention cohorts, and actionable lists." />
  <meta property="og:title" content="Flute Gandharvas CRM" />
  <meta property="og:description" content="Hackathon Attendance &amp; Retention CRM module for Flute Gandharvas." />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      /* Palette — Light Theme */
      --bg-canvas: #F8FAFC;
      --bg-surface: #FFFFFF;
      --bg-surface-subtle: #F1F5F9;
      --bg-surface-hover: #F8FAFC;
      --bg-sidebar: #FFFFFF;
      --bg-table-header: #F8FAFC;
      --bg-input: #FFFFFF;
      --bg-overlay: rgba(15, 23, 42, 0.45);

      --text-primary: #0F172A;
      --text-secondary: #475569;
      --text-muted: #64748B;
      --text-disabled: #94A3B8;
      --text-inverse: #FFFFFF;

      --border-subtle: #E2E8F0;
      --border-strong: #CBD5E1;

      /* Brand Accent */
      --accent: #0F766E;
      --accent-hover: #115E59;
      --accent-soft: #CCFBF1;
      --accent-soft-text: #0F766E;
      --accent-ring: rgba(15, 118, 110, 0.25);

      /* Semantic Colors */
      --green: #15803D;
      --green-bg: #DCFCE7;
      --green-border: #BBF7D0;
      --amber: #B45309;
      --amber-bg: #FEF3C7;
      --amber-border: #FDE68A;
      --red: #B91C1C;
      --red-bg: #FEE2E2;
      --red-border: #FECACA;
      --slate-badge-bg: #F1F5F9;
      --slate-badge-text: #475569;
      --blue: #1D4ED8;
      --blue-bg: #DBEAFE;

      /* Chart Tokens */
      --chart-grid: #E2E8F0;
      --chart-tick: #64748B;
      --chart-prev: #94A3B8;

      /* Geometry & Spacing (8px grid) */
      --sp-1: 4px;
      --sp-2: 8px;
      --sp-3: 12px;
      --sp-4: 16px;
      --sp-5: 20px;
      --sp-6: 24px;
      --sp-8: 32px;

      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-card: 12px;
      --radius-pill: 9999px;

      --sidebar-width: 248px;
      --sidebar-collapsed-width: 72px;
      --topbar-height: 64px;

      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-pop: 0 10px 25px -5px rgba(15, 23, 42, 0.12), 0 4px 10px -4px rgba(15, 23, 42, 0.06);
      --transition-fast: 150ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    html[data-theme="dark"] {
      --bg-canvas: #0B1120;
      --bg-surface: #111827;
      --bg-surface-subtle: #1E293B;
      --bg-surface-hover: #1A2436;
      --bg-sidebar: #0F172A;
      --bg-table-header: #162032;
      --bg-input: #1E293B;
      --bg-overlay: rgba(2, 6, 23, 0.7);

      --text-primary: #F1F5F9;
      --text-secondary: #CBD5E1;
      --text-muted: #94A3B8;
      --text-disabled: #64748B;
      --text-inverse: #FFFFFF;

      --border-subtle: #1E293B;
      --border-strong: #334155;

      --accent: #0F766E;
      --accent-hover: #0D9488;
      --accent-soft: rgba(20, 184, 166, 0.16);
      --accent-soft-text: #5EEAD4;
      --accent-ring: rgba(45, 212, 191, 0.35);

      --green: #4ADE80;
      --green-bg: rgba(22, 163, 74, 0.18);
      --green-border: rgba(74, 222, 128, 0.3);
      --amber: #FBBF24;
      --amber-bg: rgba(217, 119, 6, 0.2);
      --amber-border: rgba(251, 191, 36, 0.3);
      --red: #F87171;
      --red-bg: rgba(220, 38, 38, 0.2);
      --red-border: rgba(248, 113, 113, 0.3);
      --slate-badge-bg: #1E293B;
      --slate-badge-text: #CBD5E1;
      --blue: #60A5FA;
      --blue-bg: rgba(37, 99, 235, 0.2);

      --chart-grid: #1E293B;
      --chart-tick: #94A3B8;
      --chart-prev: #64748B;

      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.25);
      --shadow-pop: 0 14px 30px -5px rgba(0, 0, 0, 0.55);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      color: var(--text-primary);
      background-color: var(--bg-canvas);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .tabular {
      font-variant-numeric: tabular-nums;
    }

    a {
      color: var(--accent-soft-text);
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }

    button, input, select, textarea {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* Layout Shell */
    .app-shell {
      display: flex;
      height: 100vh;
      height: 100dvh;
      width: 100%;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: var(--sidebar-width);
      flex-shrink: 0;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100%;
      z-index: 30;
      overscroll-behavior: contain;
      transition: width var(--transition-fast);
    }
    .pager { display: flex; justify-content: center; align-items: center; gap: 10px; flex-wrap: wrap; padding: 4px 0; }
    .pager-info { font-size: 12.5px; color: var(--text-muted); min-width: 170px; text-align: center; }
    .sidebar.collapsed {
      width: var(--sidebar-collapsed-width);
    }

    .sidebar-brand {
      height: var(--topbar-height);
      padding: 0 var(--sp-4);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-subtle);
      gap: var(--sp-2);
    }
    .brand-lockup {
      display: flex;
      align-items: center;
      gap: var(--sp-3);
      min-width: 0;
      overflow: hidden;
    }
    .brand-mark {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--accent);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      flex-shrink: 0;
      letter-spacing: -0.02em;
    }
    .brand-text {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .brand-name {
      font-weight: 700;
      font-size: 14px;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .brand-sub {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .sidebar.collapsed .brand-text,
    .sidebar.collapsed .nav-label,
    .sidebar.collapsed .nav-section-title,
    .sidebar.collapsed .nav-badge,
    .sidebar.collapsed .soon-tag {
      display: none;
    }
    .sidebar.collapsed .sidebar-brand {
      justify-content: center;
      padding: 0 var(--sp-2);
    }
    .sidebar.collapsed .collapse-btn {
      position: absolute;
      right: -12px;
      top: 20px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-sm);
    }

    .collapse-btn {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .collapse-btn:hover {
      background: var(--bg-surface-subtle);
      color: var(--text-primary);
    }

    .sidebar-scroll {
      flex: 1;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: var(--sp-4) var(--sp-3);
      display: flex;
      flex-direction: column;
      gap: var(--sp-6);
    }

    .nav-section-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 0 var(--sp-3);
      margin-bottom: var(--sp-2);
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: var(--sp-3);
      padding: 9px var(--sp-3);
      border-radius: var(--radius-md);
      color: var(--text-secondary);
      font-weight: 500;
      font-size: 13.5px;
      cursor: pointer;
      border: none;
      background: transparent;
      width: 100%;
      text-align: left;
      transition: background var(--transition-fast), color var(--transition-fast);
      white-space: nowrap;
      text-decoration: none;
    }
    .nav-item:hover:not(.disabled) {
      background: var(--bg-surface-subtle);
      color: var(--text-primary);
      text-decoration: none;
    }
    .nav-item.active {
      background: var(--accent-soft);
      color: var(--accent-soft-text);
      font-weight: 600;
    }
    .nav-item.disabled {
      color: var(--text-disabled);
      cursor: not-allowed;
      opacity: 0.72;
    }
    .nav-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .nav-label {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .nav-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 1px 7px;
      border-radius: var(--radius-pill);
      background: var(--amber-bg);
      color: var(--amber);
      font-variant-numeric: tabular-nums;
    }
    .nav-badge.red {
      background: var(--red-bg);
      color: var(--red);
    }
    .soon-tag {
      font-size: 10px;
      font-weight: 500;
      color: var(--text-disabled);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-pill);
      padding: 1px 6px;
    }
    .sidebar.collapsed .nav-item {
      justify-content: center;
      padding: 10px;
    }

    /* Main Column */
    .main-column {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior: contain;
    }

    /* Top Bar */
    .topbar {
      flex-shrink: 0; /* the main column is fixed-height now; never squash the bar under its wrapped controls */
      min-height: var(--topbar-height);
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      padding: var(--sp-3) var(--sp-6);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--sp-4);
      position: sticky;
      top: 0;
      z-index: 20;
      flex-wrap: wrap;
    }
    .topbar-left {
      display: flex;
      align-items: center;
      gap: var(--sp-3);
      min-width: 0;
    }
    .mobile-menu-btn {
      display: none;
      width: 40px;
      height: 40px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface);
      color: var(--text-primary);
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .page-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.015em;
      margin: 0;
      color: var(--text-primary);
      white-space: nowrap;
    }

    .topbar-controls {
      display: flex;
      align-items: center;
      gap: var(--sp-2);
      flex-wrap: wrap;
    }

    .select-control {
      height: 36px;
      padding: 0 var(--sp-3);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      background: var(--bg-input);
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .select-control:hover {
      border-color: var(--border-strong);
    }

    .sync-chip {
      height: 36px;
      padding: 0 var(--sp-3);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface-subtle);
      color: var(--text-secondary);
      font-size: 12.5px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: var(--sp-2);
      cursor: pointer;
      white-space: nowrap;
    }
    .sync-chip:hover {
      border-color: var(--border-strong);
      color: var(--text-primary);
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status-dot.green { background: #16A34A; }
    .status-dot.amber { background: #D97706; }
    .status-dot.red { background: #DC2626; }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface);
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .icon-btn:hover {
      background: var(--bg-surface-subtle);
      color: var(--text-primary);
    }

    /* User Avatar Menu */
    .user-menu-wrap {
      position: relative;
    }
    .user-trigger {
      height: 36px;
      padding: 2px var(--sp-3) 2px 4px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface);
      display: inline-flex;
      align-items: center;
      gap: var(--sp-2);
      cursor: pointer;
      white-space: nowrap;
    }
    .user-trigger:hover {
      border-color: var(--border-strong);
    }
    .avatar-circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--accent);
      color: #FFFFFF;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .user-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      line-height: 1.15;
    }
    .user-name {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .user-role {
      font-size: 10.5px;
      color: var(--text-muted);
    }
    .user-dropdown {
      position: absolute;
      right: 0;
      top: calc(100% + 6px);
      width: 260px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-pop);
      padding: var(--sp-2);
      z-index: 50;
      display: none;
    }
    .user-dropdown.open {
      display: block;
    }
    .dropdown-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      padding: var(--sp-2) var(--sp-3);
    }
    .role-option {
      width: 100%;
      padding: var(--sp-2) var(--sp-3);
      border: none;
      background: transparent;
      border-radius: var(--radius-md);
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--sp-2);
    }
    .role-option:hover {
      background: var(--bg-surface-subtle);
    }
    .role-option.active {
      background: var(--accent-soft);
      color: var(--accent-soft-text);
    }
    .role-option-title {
      font-size: 13px;
      font-weight: 600;
    }
    .role-option-desc {
      font-size: 11.5px;
      color: var(--text-muted);
      display: block;
    }

    /* Main Content Container */
    .content-area {
      flex: 1;
      padding: var(--sp-6);
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: var(--sp-6);
    }

    /* Banners */
    .alert-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--sp-4);
      padding: var(--sp-3) var(--sp-4);
      border-radius: var(--radius-card);
      border: 1px solid var(--red-border);
      background: var(--red-bg);
      color: var(--red);
      font-size: 13.5px;
      font-weight: 500;
      flex-wrap: wrap;
    }
    .alert-banner.info {
      border-color: var(--border-subtle);
      background: var(--bg-surface);
      color: var(--text-secondary);
    }
    .alert-banner-left {
      display: flex;
      align-items: center;
      gap: var(--sp-3);
      min-width: 0;
    }
    .alert-banner-actions {
      display: flex;
      align-items: center;
      gap: var(--sp-2);
    }

    /* Cards & Grids */
    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-card);
      padding: var(--sp-5);
      box-shadow: var(--shadow-sm);
    }
    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--sp-4);
      margin-bottom: var(--sp-4);
      flex-wrap: wrap;
    }
    .card-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      margin: 0;
    }
    .card-subtitle {
      font-size: 12.5px;
      color: var(--text-muted);
      margin: 2px 0 0 0;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(195px, 1fr));
      gap: var(--sp-4);
    }
    .kpi-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-card);
      padding: var(--sp-4);
      display: flex;
      flex-direction: column;
      gap: var(--sp-2);
      box-shadow: var(--shadow-sm);
      transition: border-color var(--transition-fast);
    }
    .kpi-card.clickable {
      cursor: pointer;
    }
    .kpi-card.clickable:hover {
      border-color: var(--accent);
    }
    .kpi-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--sp-2);
    }
    .kpi-value-row {
      display: flex;
      align-items: baseline;
      gap: var(--sp-2);
      flex-wrap: wrap;
    }
    .kpi-primary {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: var(--text-primary);
      font-variant-numeric: tabular-nums;
      line-height: 1.15;
    }
    .kpi-counts {
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
    }
    .kpi-foot {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: var(--sp-2);
      flex-wrap: wrap;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--sp-4);
    }
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--sp-4);
    }
    .grid-charts-main {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
      gap: var(--sp-4);
    }

    .chart-box {
      position: relative;
      height: 260px;
      width: 100%;
    }
    .chart-box-sm {
      position: relative;
      height: 150px;
      width: 100%;
    }

    /* Pill Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 9px;
      border-radius: var(--radius-pill);
      font-size: 11.5px;
      font-weight: 600;
      line-height: 1.5;
      white-space: nowrap;
      border: 1px solid transparent;
    }
    .badge-green {
      background: var(--green-bg);
      color: var(--green);
      border-color: var(--green-border);
    }
    .badge-amber {
      background: var(--amber-bg);
      color: var(--amber);
      border-color: var(--amber-border);
    }
    .badge-red {
      background: var(--red-bg);
      color: var(--red);
      border-color: var(--red-border);
    }
    .badge-teal {
      background: var(--accent-soft);
      color: var(--accent-soft-text);
    }
    .badge-slate {
      background: var(--slate-badge-bg);
      color: var(--slate-badge-text);
      border-color: var(--border-subtle);
    }
    .badge-blue {
      background: var(--blue-bg);
      color: var(--blue);
    }

    /* Buttons */
    .btn {
      height: 36px;
      padding: 0 var(--sp-4);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface);
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--sp-2);
      white-space: nowrap;
      transition: background var(--transition-fast), border-color var(--transition-fast);
    }
    .btn:hover:not(:disabled) {
      background: var(--bg-surface-subtle);
      border-color: var(--border-strong);
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #FFFFFF;
    }
    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }
    .btn-sm {
      height: 30px;
      padding: 0 var(--sp-3);
      font-size: 12px;
    }

    /* Segmented Tabs */
    .segmented {
      display: inline-flex;
      align-items: center;
      background: var(--bg-surface-subtle);
      padding: 3px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      gap: 2px;
      flex-wrap: wrap;
    }
    .seg-btn {
      padding: 5px 12px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .seg-btn:hover {
      color: var(--text-primary);
    }
    .seg-btn.active {
      background: var(--bg-surface);
      color: var(--text-primary);
      font-weight: 600;
      box-shadow: var(--shadow-sm);
    }

    /* Tab Bar (for Lists) */
    .tabs-bar {
      display: flex;
      align-items: center;
      gap: var(--sp-2);
      border-bottom: 1px solid var(--border-subtle);
      overflow-x: auto;
      padding-bottom: 0;
    }
    .tab-btn {
      padding: var(--sp-3) var(--sp-4);
      border: none;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: var(--sp-2);
      margin-bottom: -1px;
    }
    .tab-btn:hover {
      color: var(--text-primary);
    }
    .tab-btn.active {
      color: var(--accent-soft-text);
      border-bottom-color: var(--accent);
    }
    .tab-count {
      font-size: 11px;
      padding: 1px 6px;
      border-radius: var(--radius-pill);
      background: var(--bg-surface-subtle);
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
    }

    /* Tables */
    .table-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-card);
      background: var(--bg-surface);
    }
    table.data-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13px;
    }
    .data-table thead th {
      position: sticky;
      top: 0;
      background: var(--bg-table-header);
      color: var(--text-muted);
      font-size: 11.5px;
      font-weight: 600;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border-subtle);
      white-space: nowrap;
      z-index: 2;
      user-select: none;
    }
    .data-table thead th.sortable {
      cursor: pointer;
    }
    .data-table thead th.sortable:hover {
      color: var(--text-primary);
    }
    .data-table tbody td {
      padding: 11px 14px;
      border-bottom: 1px solid var(--border-subtle);
      vertical-align: middle;
      color: var(--text-primary);
    }
    .data-table tbody tr:last-child td {
      border-bottom: none;
    }
    .data-table tbody tr.clickable-row {
      cursor: pointer;
    }
    .data-table tbody tr.clickable-row:hover {
      background: var(--bg-surface-hover);
    }
    .data-table tbody tr.row-muted td {
      opacity: 0.62;
    }
    .num {
      text-align: right;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    th.num {
      text-align: right;
    }
    .name-cell {
      min-width: 160px;
      max-width: 260px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .email-cell { white-space: nowrap; font-size: 12.5px; color: var(--text-muted); }
    .table-wrap { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
    .table-wrap::-webkit-scrollbar { height: 10px; }
    .table-wrap::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 10px; border: 2px solid var(--bg-surface); }
    .tag-soft { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--blue-bg); color: var(--blue); margin-left: 6px; white-space: nowrap; }
    .call-cell { white-space: nowrap; font-size: 12px; }
    .call-cell .sub-cell { white-space: nowrap; }
    dialog.call-dialog { border: 1px solid var(--border-subtle); border-radius: 16px; padding: 0; width: min(460px, calc(100vw - 32px)); background: var(--bg-surface); color: var(--text-primary); box-shadow: 0 24px 64px -16px rgba(15,23,42,.35); }
    dialog.call-dialog::backdrop { background: var(--bg-overlay); }
    .call-form { display: flex; flex-direction: column; gap: 14px; padding: 22px; }
    .call-form h2 { margin: 0; font-size: 17px; }
    .call-form .field-group { display: flex; flex-direction: column; gap: 6px; }
    .call-form textarea { min-height: 70px; resize: vertical; font: inherit; }
    .call-form-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .sub-cell {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 400;
    }

    /* Toolbar / Filter Bar */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--sp-3);
      flex-wrap: wrap;
    }
    .toolbar-left {
      display: flex;
      align-items: center;
      gap: var(--sp-2);
      flex-wrap: wrap;
      flex: 1;
      min-width: 0;
    }
    .search-input {
      height: 36px;
      min-width: 220px;
      flex: 0 1 280px;
      padding: 0 var(--sp-3);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      background: var(--bg-input);
      color: var(--text-primary);
      font-size: 13px;
    }
    .search-input::placeholder {
      color: var(--text-muted);
    }

    /* Heat Strip (7 weeks) */
    .heat-strip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .heat-sq {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      display: inline-block;
    }
    .heat-attended { background: #16A34A; }
    .heat-partial { background: #F59E0B; }
    .heat-missed { background: var(--border-strong); }
    .heat-upcoming {
      background: transparent;
      border: 1.5px dashed var(--border-strong);
    }

    /* Regularity Progress Bar */
    .score-bar-wrap {
      display: inline-flex;
      align-items: center;
      gap: var(--sp-2);
      min-width: 96px;
    }
    .score-bar-track {
      flex: 1;
      height: 6px;
      border-radius: 999px;
      background: var(--bg-surface-subtle);
      overflow: hidden;
      min-width: 48px;
    }
    .score-bar-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--accent);
    }
    .score-bar-fill.amber { background: #D97706; }
    .score-bar-fill.red { background: #DC2626; }

    /* Timeline Bar (Join/Leave Segments) */
    .timeline-drawer {
      background: var(--bg-surface-subtle);
      padding: var(--sp-4);
      border-radius: var(--radius-md);
    }
    .timeline-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--sp-2);
      font-size: 12px;
      color: var(--text-secondary);
      flex-wrap: wrap;
      gap: var(--sp-2);
    }
    .timeline-track {
      position: relative;
      height: 28px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      overflow: visible;
    }
    .timeline-late-line {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      border-left: 1px dashed var(--amber);
      z-index: 1;
      pointer-events: none;
    }
    .timeline-seg {
      position: absolute;
      top: 4px;
      bottom: 4px;
      background: var(--accent);
      border-radius: 4px;
      cursor: pointer;
      transition: filter var(--transition-fast);
      min-width: 4px;
    }
    .timeline-seg:hover {
      filter: brightness(1.12);
    }
    .timeline-seg-tooltip {
      display: none;
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--text-primary);
      color: var(--bg-surface);
      font-size: 11px;
      font-weight: 500;
      padding: 4px 8px;
      border-radius: 5px;
      white-space: nowrap;
      z-index: 20;
      pointer-events: none;
    }
    .timeline-seg:hover .timeline-seg-tooltip,
    .timeline-seg:focus .timeline-seg-tooltip {
      display: block;
    }
    .timeline-axis {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
      font-size: 11px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    /* Funnel Rows */
    .funnel-list {
      display: flex;
      flex-direction: column;
      gap: var(--sp-3);
    }
    .funnel-stage {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .funnel-meta {
      display: flex;
      justify-content: space-between;
      font-size: 12.5px;
      font-variant-numeric: tabular-nums;
    }
    .funnel-bar-bg {
      height: 10px;
      border-radius: 999px;
      background: var(--bg-surface-subtle);
      overflow: hidden;
    }
    .funnel-bar-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--accent);
    }

    /* Calendar Session Grid */
    /* Sessions: one card per phase, weeks × Sun/Tue/Thu */
    .sess-filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .sess-filters .select-control { flex: 0 1 auto; min-width: 150px; }
    .sess-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .sess-chip { display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 999px; background: var(--bg-surface-subtle); color: var(--text-secondary); border: 1px solid var(--border-subtle); }
    button.sess-chip { cursor: pointer; }
    button.sess-chip:hover { border-color: var(--border-strong); }
    .sess-chip b { color: var(--text-primary); font-variant-numeric: tabular-nums; }
    .sess-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
    .sess-phase-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
    .sess-host { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); }
    .sess-scroll { overflow-x: auto; margin: 0 -4px; }
    .sess-grid { width: 100%; min-width: 560px; border-collapse: separate; border-spacing: 6px; table-layout: fixed; }
    .sess-grid th { font-size: 11.5px; font-weight: 600; color: var(--text-muted); text-align: left; padding: 0 4px 2px; text-transform: uppercase; letter-spacing: .04em; }
    .sess-grid th.wk { width: 92px; }
    .sess-wk { font-size: 13px; font-weight: 700; color: var(--text-primary); white-space: nowrap; }
    .sess-wk small { display: block; font-size: 11.5px; font-weight: 500; color: var(--text-muted); }
    .sess-cell { border-radius: 10px; padding: 10px 12px; background: var(--bg-surface-subtle); border: 1px solid var(--border-subtle); vertical-align: top; height: 74px; transition: border-color .15s, box-shadow .15s; }
    .sess-cell.open { cursor: pointer; background: var(--bg-surface); }
    .sess-cell.open:hover { border-color: var(--accent); box-shadow: 0 4px 14px -6px var(--accent-ring); }
    .sess-cell.open:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .sess-cell.dim { opacity: .35; }
    .sess-num { font-size: 20px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; color: var(--text-primary); }
    .sess-num span { font-size: 12px; font-weight: 600; color: var(--text-muted); margin-left: 4px; }
    .sess-sub { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sess-bar { height: 4px; border-radius: 4px; background: var(--border-subtle); margin-top: 7px; overflow: hidden; }
    .sess-bar i { display: block; height: 100%; border-radius: 4px; background: var(--accent); }
    .sess-state { font-size: 12px; font-weight: 600; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
    .sess-state.warn { color: var(--amber); }

    .week-calendar-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: var(--sp-4);
    }
    .week-column {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-card);
      padding: var(--sp-4);
      display: flex;
      flex-direction: column;
      gap: var(--sp-3);
    }
    .week-column-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: var(--sp-2);
      border-bottom: 1px solid var(--border-subtle);
    }
    .session-mini-card {
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: var(--sp-3);
      background: var(--bg-canvas);
      display: flex;
      flex-direction: column;
      gap: var(--sp-2);
      transition: border-color var(--transition-fast);
    }
    .session-mini-card.clickable {
      cursor: pointer;
    }
    .session-mini-card.clickable:hover {
      border-color: var(--accent);
    }
    .session-mini-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: var(--sp-2);
    }
    .session-mini-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--sp-2);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      padding-top: var(--sp-2);
      border-top: 1px solid var(--border-subtle);
    }
    .stat-mini-label {
      color: var(--text-muted);
      font-size: 11px;
      display: block;
    }
    .stat-mini-val {
      font-weight: 600;
      color: var(--text-primary);
    }

    /* Review Queue Cards */
    .review-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: var(--sp-4);
    }
    .review-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-card);
      padding: var(--sp-4);
      display: flex;
      flex-direction: column;
      gap: var(--sp-3);
    }
    .suggestion-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--sp-2);
      padding: var(--sp-2) var(--sp-3);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      background: var(--bg-canvas);
    }

    /* Settings Form */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: var(--sp-4);
    }
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .field-label {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-secondary);
    }
    .field-help {
      font-size: 11.5px;
      color: var(--text-muted);
    }
    .input-control {
      height: 36px;
      padding: 0 var(--sp-3);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      background: var(--bg-input);
      color: var(--text-primary);
      font-size: 13.5px;
      font-variant-numeric: tabular-nums;
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: var(--sp-4);
      flex-wrap: wrap;
    }
    .checkbox-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      cursor: pointer;
    }

    /* Empty States & Skeletons */
    .empty-state {
      background: var(--bg-surface);
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius-card);
      padding: var(--sp-8) var(--sp-6);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--sp-3);
    }
    .empty-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--bg-surface-subtle);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .skeleton {
      background: linear-gradient(90deg, var(--bg-surface-subtle) 25%, var(--border-subtle) 50%, var(--bg-surface-subtle) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite linear;
      border-radius: 6px;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Needs Attention List */
    .attention-list {
      display: flex;
      flex-direction: column;
      gap: var(--sp-2);
    }
    .attention-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--sp-3);
      padding: var(--sp-3);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      background: var(--bg-canvas);
      flex-wrap: wrap;
    }

    /* Toast Notification */
    .toast-container {
      position: fixed;
      bottom: var(--sp-6);
      right: var(--sp-6);
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: var(--sp-2);
      pointer-events: none;
    }
    .toast {
      background: var(--text-primary);
      color: var(--bg-surface);
      padding: 10px 16px;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 500;
      box-shadow: var(--shadow-pop);
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: var(--sp-2);
    }

    /* Mobile Cards for Tables */
    .mobile-cards-only {
      display: none;
    }
    .desktop-table-only {
      display: block;
    }

    /* Sidebar Mobile Backdrop */
    .sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--bg-overlay);
      z-index: 25;
    }
    .sidebar-backdrop.open {
      display: block;
    }

    /* Responsive Breakpoints (1024px & 390px) */
    @media (max-width: 1120px) {
      .grid-charts-main,
      .grid-2,
      .grid-3 {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    @media (max-width: 820px) {
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        transform: translateX(-100%);
        transition: transform var(--transition-fast);
        width: 268px !important;
        z-index: 40;
      }
      .sidebar.mobile-open {
        transform: translateX(0);
      }
      .sidebar .collapse-btn {
        display: none;
      }
      .mobile-menu-btn {
        display: inline-flex;
      }
      .topbar {
        padding: var(--sp-3) var(--sp-4);
      }
      .content-area {
        padding: var(--sp-4);
        gap: var(--sp-4);
      }
    }

    @media (max-width: 560px) {
      .topbar {
        gap: var(--sp-2);
      }
      .topbar-controls {
        width: 100%;
      }
      .select-control {
        flex: 1 1 140px;
        min-width: 0;
      }
      .user-meta {
        display: none;
      }
      .review-grid {
        grid-template-columns: 1fr;
      }
      .desktop-table-only {
        display: none;
      }
      .mobile-cards-only {
        display: flex;
        flex-direction: column;
        gap: var(--sp-3);
      }
      .mobile-card {
        background: var(--bg-surface);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-card);
        padding: var(--sp-4);
        display: flex;
        flex-direction: column;
        gap: var(--sp-2);
      }
      .kpi-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .kpi-primary {
        font-size: 21px;
      }
    }

    /* ---------- Live-data additions: login, states, forms ---------- */
    .visually-hidden {
      position: absolute !important;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0);
      white-space: nowrap; border: 0;
    }
    .login-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--sp-4);
      background: var(--bg-canvas);
    }
    .login-card {
      width: 100%;
      max-width: 380px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-pop);
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: var(--sp-4);
    }
    .login-card .input-control { width: 100%; }

    /* ---------- Sign-in (split screen) ---------- */

<body>
  <div id="app"></div>

  <script>
    /* =========================================================================
       Flute Gandharvas CRM — module 1 (Hackathon attendance & retention)
       Every number on screen comes from the API described in API.md.
       There is no mock data in this file.
       ========================================================================= */

    /* =========================================================================
       1. CONSTANTS (structure of the programme, not data)
       ========================================================================= */
    // Mirrors DEFAULT_RULES in server/model.js — used only by "Reset defaults".
    const DEFAULT_RULES = {
      attendedMinMinutes: 20,
      lateThresholdMinutes: 10,
      leftEarlyMinutes: 15,
      regularStreakWeeks: 3,
      regularMinMinutes: 60,
      missedTwiceCount: 2,

    };
    const SESSION_TYPES = ["Sunday Learning", "Tuesday Practice", "Thursday Q&A"];
    const SLOT_DEFS = [
      { key: "learning_p1", label: "Learning · Phase 1", hint: "Sunday learning (Straight flute)" },
      { key: "learning_p2", label: "Learning · Phase 2", hint: "Sunday learning (Side flute)" },
      { key: "practice_p1", label: "Practice & Q&A · Phase 1", hint: "Shared Tue + Thu meeting" },
      { key: "practice_p2", label: "Practice & Q&A · Phase 2", hint: "Shared Tue + Thu meeting" }
    ];
    // Phase 2 runs weeks 8–14. The overview payload sends weekOffset; this is only a fallback.
    const P2_WEEK_OFFSET_FALLBACK = 7;
    const LEARNER_PAGE = 50;
    const LIST_PAGE = 50;
    const REVIEW_PAGE = 10;

    // Page n of rows, where limit = n * size (state keeps the end index so filter resets still work)
    function pageOf(rows, limit, size) {
      const pages = Math.max(1, Math.ceil(rows.length / size));
      const page = Math.min(pages, Math.max(1, Math.round(limit / size)));
      return { page, pages, start: (page - 1) * size, rows: rows.slice((page - 1) * size, page * size) };
    }
    function pagerHtml(total, pg, size, fn) {
      if (pg.pages <= 1) return "";
      const a = pg.start + 1, b = Math.min(total, pg.start + size);
      return `<div class="pager">
        <button class="btn btn-sm" ${pg.page <= 1 ? "disabled" : ""} onclick="${fn}(${pg.page - 1})">‹ Prev</button>
        <span class="pager-info tabular">${fmtNum(a)}–${fmtNum(b)} of ${fmtNum(total)} · page ${fmtNum(pg.page)} of ${fmtNum(pg.pages)}</span>
        <button class="btn btn-sm" ${pg.page >= pg.pages ? "disabled" : ""} onclick="${fn}(${pg.page + 1})">Next ›</button>
      </div>`;
    }
    const PARTICIPANT_CAP = 200;
    const ALL_DATA_KEYS = ["bootstrap", "overview", "sessions", "session", "learners", "learner", "lists", "review", "sync", "settings"];

    const ROLE_ACCESS = {
      "Admin": ["overview", "sessions", "session", "learners", "learner", "lists", "review", "sync", "settings"],
      "Team member": ["lists"], // callers: the call lists only (no learner directory)
      "Viewer": ["overview"]
    };
    const ROLE_SUMMARY = {
      "Admin": "Everything, including Settings",
      "Team member": "Call lists only (can log calls)",
      "Viewer": "Overview only"
    };

    const NAV_ITEMS = [
      { id: "overview", label: "Overview", hash: "#/overview", icon: "grid" },
      { id: "sessions", label: "Sessions", hash: "#/sessions", icon: "calendar" },
      { id: "learners", label: "Learners", hash: "#/learners", icon: "users" },
      { id: "lists", label: "Lists", hash: "#/lists", icon: "list" },
      { id: "review", label: "Review Queue", hash: "#/review", icon: "inbox", badgeKey: "unmatched" },
      { id: "sync", label: "Sync & Alerts", hash: "#/sync", icon: "refresh", badgeKey: "alerts" },
      { id: "settings", label: "Settings", hash: "#/settings", icon: "settings" }
    ];

    const COMING_SOON = [
      { label: "Webinars", icon: "video" },
      { label: "Leads & Ads", icon: "megaphone" },
      { label: "Payments", icon: "credit" },
      { label: "Support Inbox", icon: "message" },
      { label: "Mentors & 1:1 Hours", icon: "clock" },
      { label: "GoSorilla", icon: "compass" }
    ];

    const SCREEN_TITLES = {
      overview: "Hackathon Overview",
      sessions: "Sessions Calendar & Metrics",
      session: "Session Attendance Detail",
      learners: "Paid Learners Directory",
      learner: "Learner Profile",
      lists: "Exportable Outreach Lists",
      review: "Unmatched Review Queue",
      sync: "Sync Sources & Alerts",
      settings: "Rules, Calendar & Roles"
    };

    /* =========================================================================
       2. APP STATE
       ========================================================================= */
    function safeGet(k) { try { return localStorage.getItem(k); } catch (_) { return null; } }
    function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (_) { /* storage unavailable */ } }

    const state = {
      authRequired: false,
      user: null,
      batchId: null,
      phase: "All",
      region: "All",
      theme: safeGet("fg_theme") === "dark" ? "dark" : "light",
      sidebarCollapsed: false,
      mobileMenuOpen: false,
      userMenuOpen: false,
      bannerDismissed: false,
      charts: {},
      // Sessions
      sessionsView: "calendar",
      sessFilter: { type: "All", status: "All", host: "All" },
      sessionsSort: { key: "date", dir: "asc" },
      sessionParticipantSearch: "",
      sessionParticipantSort: { key: "totalMinutes", dir: "desc" },
      expandedParticipantIdx: null,
      sessionShowAll: false,
      // Overview
      overviewFunnelWeek: null,
      // Learners
      learnersFilter: { search: "", status: "All", regular: "All", missedTwice: "All", sortKey: "regularityScore", sortDir: "desc", selected: new Set() },
      learnersLimit: LEARNER_PAGE,
      // Lists
      listsTab: "missed_twice",
      diamondInviteLimit: 25,
      listsSearch: "",
      listsLimit: LIST_PAGE,
      // Review
      reviewSearch: {},          // identityKey -> { q, results, loading, error, seq, timer }
      reviewBusy: new Set(),     // identityKeys with a resolve in flight
      reviewLimit: REVIEW_PAGE,
      // Sync
      syncRunning: { zoom: false, tagmango: false },
      importBusy: false,
      importResult: null,
      // Login
      login: { busy: false, error: "" },
      // Settings
      confirm: null,             // "batch:3" | "meeting:12" | "user:4" — second click confirms
      meetingForm: null,         // { batchId, slot, meetingId|null }
      pwFormUser: null,          // user id whose reset-password form is open
      focusAfterRender: null,    // element id to focus after the next render
      busy: new Set(),           // in-flight write keys
      formMsg: {}                // formId -> { type: "error"|"ok", text }
    };

    /* =========================================================================
       3. DATA LAYER — async fetch + small cache keyed per endpoint/batch
       ========================================================================= */
    class ApiError extends Error {
      constructor(status, message, body) {
        super(message);
        this.status = status;
        this.body = body;
      }
    }

    async function apiFetch(method, path, body, opts = {}) {
      const init = { method, credentials: "same-origin", headers: { Accept: "application/json" } };
      if (body !== undefined) {
        init.headers["Content-Type"] = "application/json";
        init.body = JSON.stringify(body);
      }
      let res;
      try {
        res = await fetch(path, init);
      } catch (_) {
        throw new ApiError(0, "Can't reach the server. Check your connection and try again.");
      }
      let data = null;
      const text = await res.text();
      if (text) {
        try { data = JSON.parse(text); } catch (_) { data = null; }
      }
      if (res.status === 401 && !opts.allow401) {
        onUnauthorized();
        throw new ApiError(401, "Your session has ended. Please sign in again.", data);
      }
      if (!res.ok) {
        const raw = data && (data.error || data.message);
        const msg = typeof raw === "string" && raw ? raw : `Request failed (HTTP ${res.status})`;
        throw new ApiError(res.status, msg, data);
      }
      return data || {};
    }
    const getJSON = path => apiFetch("GET", path);

    const store = { data: new Map(), errors: new Map(), pending: new Map(), stale: new Set(), gen: new Map(), epoch: 0 };

    /** Returns cached data for `key`, starting a load when missing or stale. */
    function need(key, loader) {
      const has = store.data.has(key);
      const err = store.errors.get(key);
      if (!store.pending.has(key) && !err && (!has || store.stale.has(key))) startLoad(key, loader);
      return { data: has ? store.data.get(key) : null, error: has ? null : (err || null), loading: !has && !err };
    }

    function startLoad(key, loader) {
      const gen = (store.gen.get(key) || 0) + 1;
      const epoch = store.epoch;
      store.gen.set(key, gen);
      store.stale.delete(key);
      const p = Promise.resolve()
        .then(loader)
        .then(
          d => {
            if (store.epoch !== epoch || store.gen.get(key) !== gen) return;
            store.data.set(key, d);
            store.errors.delete(key);
          },
          e => {
            if (store.epoch !== epoch || store.gen.get(key) !== gen) return;
            if (e && e.status === 401) return; // login screen takes over
            store.errors.set(key, e instanceof ApiError ? e : new ApiError(0, (e && e.message) || "Unexpected error"));
          }
        )
        .finally(() => {
          if (store.pending.get(key) === p) store.pending.delete(key);
          scheduleRender();
        });
      store.pending.set(key, p);
    }

    /** Marks every cache key equal to / starting with "<prefix>:" as stale (kept on screen until fresh data arrives). */
    function invalidate(...prefixes) {
      const keys = new Set([...store.data.keys(), ...store.errors.keys(), ...store.pending.keys()]);
      for (const k of keys) {
        if (!prefixes.some(p => k === p || k.startsWith(p + ":"))) continue;
        store.stale.add(k);
        store.errors.delete(k);
        store.pending.delete(k);
        store.gen.set(k, (store.gen.get(k) || 0) + 1);
      }
      scheduleRender();
    }

    function resetStore() {
      store.epoch++;
      store.data.clear();
      store.errors.clear();
      store.pending.clear();
      store.stale.clear();
    }

    function onUnauthorized() {
      if (state.authRequired) return;
      state.authRequired = true;
      state.user = null;
      state.userMenuOpen = false;
      resetStore();
      scheduleRender();
    }

    let renderQueued = false;
    function scheduleRender() {
      if (renderQueued) return;
      renderQueued = true;
      setTimeout(() => { renderQueued = false; render(); }, 0);
    }

    /** Runs a write; shows a toast on success/failure; invalidates the given cache prefixes. */
    async function runWrite(busyKey, fn, opts = {}) {
      if (state.busy.has(busyKey)) return null;
      state.busy.add(busyKey);
      scheduleRender();
      try {
        const res = await fn();
        if (opts.success) showToast(typeof opts.success === "function" ? opts.success(res) : opts.success);
        if (opts.after) opts.after(res);
        if (opts.invalidates && opts.invalidates.length) invalidate(...opts.invalidates);
        return res;
      } catch (e) {
        if (e && e.status === 401) return null;
        const msg = (e && e.message) || "Something went wrong";
        if (opts.onError) opts.onError(msg, e);
        else showToast(msg, "error");
        return null;
      } finally {
        state.busy.delete(busyKey);
        scheduleRender();
      }
    }
    const isBusy = k => state.busy.has(k);

    /* =========================================================================
       4. HELPERS
       ========================================================================= */

    function esc(str) {
      if (str === null || str === undefined) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function fmtNum(n) {
      if (n === null || n === undefined || Number.isNaN(Number(n))) return "—";
      return Number(n).toLocaleString("en-IN");
    }

    /** Percentage string; "—" when the base is zero/unknown (never a made-up 0%). */
    function fmtPct(num, den) {
      if (num === null || num === undefined || !den) return "—";
      return Math.round((num / den) * 100) + "%";
    }

    function addMinutesToTime(hhmm, offset) {
      if (!hhmm || !/^\d{1,2}:\d{2}/.test(String(hhmm))) return "—";
      const [h, m] = String(hhmm).split(":").map(Number);
      const total = (((h * 60 + m + Math.round(offset || 0)) % 1440) + 1440) % 1440;
      return `${String(Math.floor(total / 60)).padStart(2, "0")}:${String(total % 60).padStart(2, "0")}`;
    }

    function fmtDate(dateStr) {
      if (!dateStr) return "—";
      const d = new Date(String(dateStr).slice(0, 10) + "T00:00:00Z");
      if (Number.isNaN(d.getTime())) return String(dateStr);
      return d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" });
    }

    function fmtIstDateTime(iso) {
      if (!iso) return "—";
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return String(iso);
      return d.toLocaleString("en-IN", { timeZone: "Asia/Kolkata", day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit", hour12: false }) + " IST";
    }

    function relTime(iso) {
      if (!iso) return "never";
      const t = new Date(iso).getTime();
      if (Number.isNaN(t)) return "—";
      const diff = Date.now() - t;
      const abs = Math.abs(diff);
      const future = diff < 0;
      const fmt = (n, unit) => (future ? `in ${n} ${unit}` : `${n} ${unit} ago`);
      if (abs < 45_000) return future ? "in a moment" : "just now";
      if (abs < 3_600_000) return fmt(Math.max(1, Math.round(abs / 60_000)), "min");
      if (abs < 86_400_000) { const h = Math.round(abs / 3_600_000); return fmt(h, h === 1 ? "hour" : "hours"); }
      const dd = Math.round(abs / 86_400_000);
      return fmt(dd, dd === 1 ? "day" : "days");
    }

    function weekdayOf(dateStr) { return new Date(dateStr + "T00:00:00Z").getUTCDay(); }
    function addDaysStr(dateStr, n) {
      const d = new Date(dateStr + "T00:00:00Z");
      return new Date(d.getTime() + n * 86_400_000).toISOString().slice(0, 10);
    }
    function nextSundayOnOrAfter(dateStr) {
      if (!dateStr) return null;
      return addDaysStr(dateStr, (7 - weekdayOf(dateStr)) % 7);
    }
    const WEEKDAY_NAMES = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

    function statusBadge(status) {
      const map = {
        active: ["Active", "badge-green"],
        at_risk: ["At risk", "badge-amber"],
        inactive: ["Inactive", "badge-red"],
        late_joiner: ["Late joiner", "badge-amber"],
        moved: ["Moved to next batch", "badge-blue"],
        refunded: ["Refunded · Excluded", "badge-slate"],
        Synced: ["Synced", "badge-green"],
        Upcoming: ["Upcoming", "badge-slate"],
        "Awaiting data": ["Awaiting data", "badge-amber"],
        "Not in Zoom": ["Before tracking", "badge-slate"],
        "Sync failed": ["Sync failed", "badge-red"],
        "Not connected": ["Not connected", "badge-slate"],
        "Never synced": ["Never synced", "badge-slate"],
        Partial: ["Partial", "badge-amber"],
        Running: ["Running", "badge-blue"],
        Active: ["Active", "badge-green"],
        Completed: ["Completed", "badge-slate"]
      };
      const [label, cls] = map[status] || [status || "—", "badge-slate"];
      return `<span class="badge ${cls}">${esc(label)}</span>`;
    }

    function showToast(msg, kind) {
      const container = document.getElementById("toast-container");
      if (!container) return;
      const el = document.createElement("div");
      el.className = "toast" + (kind === "error" ? " error" : "");
      el.setAttribute("role", kind === "error" ? "alert" : "status");
      el.innerHTML = `${kind === "error" ? iconSvg("alert", 15) : iconSvg("check", 15)} <span>${esc(msg)}</span>`;
      container.appendChild(el);
      setTimeout(() => { el.remove(); }, kind === "error" ? 6000 : 2800);
    }

    function exportCSV(filename, headers, rows) {
      const cell = val => `"${String(val ?? "").replace(/"/g, '""')}"`;
      const csvLines = [headers.map(cell).join(",")];
      rows.forEach(r => { csvLines.push(r.map(cell).join(",")); });
      const blob = new Blob(["﻿" + csvLines.join("\n")], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast(`Exported ${rows.length} rows to ${filename}`);
    }

    function copyText(text, okMsg) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text)
          .then(() => showToast(okMsg || "Copied"))
          .catch(() => showToast("Couldn't access the clipboard — copy it manually", "error"));
      } else {
        showToast("Clipboard isn't available in this browser", "error");
      }
    }

    function copyNumbers(numbers) {
      const clean = [...new Set((numbers || []).map(n => String(n || "").trim()).filter(Boolean))];
      if (!clean.length) {
        showToast("No phone numbers to copy");
        return;
      }
      copyText(clean.join("\n"), `Copied ${clean.length} phone number${clean.length === 1 ? "" : "s"}`);
    }

    function destroyCharts() {
      Object.values(state.charts).forEach(c => {
        try { c.destroy(); } catch (_) { /* already gone */ }
      });
      state.charts = {};
    }

    function getCssVar(name) {
      return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }

    function getRoute() {
      const raw = (window.location.hash || "#/overview").replace(/^#\/?/, "");
      const parts = raw.split("/").filter(Boolean);
      let param = parts[1] || null;
      if (param) { try { param = decodeURIComponent(param); } catch (_) { /* keep raw */ } }
      return { screen: parts[0] || "overview", param };
    }

    function navigate(hash) {
      if (!hash) return;
      window.location.hash = hash;
    }

    function setTheme(theme) {
      state.theme = theme;
      document.documentElement.setAttribute("data-theme", theme);
      safeSet("fg_theme", theme);
      render();
    }

    const userRole = () => (state.user && state.user.role) || null;
    const isAdmin = () => userRole() === "Admin";
    const allowedScreens = () => ROLE_ACCESS[userRole()] || [];
    function canAccessHash(hash) {
      const screen = String(hash || "").replace(/^#\/?/, "").split("/")[0];
      return allowedScreens().includes(screen);
    }

    function batchById(boot, id) {
      return (boot.batches || []).find(b => b.id === id) || null;
    }
    function batchOptionLabel(b) {
      return `${b.shortName || fmtDate(b.startDate)} · ${b.status || ""}`.replace(/ · $/, "");
    }

    /** Display label for a Zoom account key ("zoom1"/"zoom2") using bootstrap sync sources. */
    function accountLabel(boot, key) {
      if (!key) return "—";
      const src = ((boot && boot.sync && boot.sync.sources) || []).find(s => s.id === key);
      if (!src) return key;
      const name = src.name || key;
      return src.account && src.account !== name ? `${name} · ${src.account}` : name;
    }

    /** "19:00 IST" or "Time TBC" when the server has no start time (non-synced sessions). */
    function timeOrTbc(t) {
      return t ? `${t} IST` : "Time TBC";
    }

    /** Week label for the selected phase: W3 / W10 / "W3 · W10". */
    function phaseWeekLabel(week, offset2) {
      const o = offset2 == null ? P2_WEEK_OFFSET_FALLBACK : offset2;
      if (state.phase === "Phase 1") return `W${week}`;
      if (state.phase === "Phase 2") return `W${week + o}`;
      return `W${week} · W${week + o}`;
    }

    function matchesPhaseRegion(row) {
      if (state.phase !== "All" && row.phase && row.phase !== state.phase) return false;
      if (state.region !== "All" && row.region && row.region !== state.region) return false;
      return true;
    }

    function cmp(a, b, key, dir) {
      const d = dir === "asc" ? 1 : -1;
      let av = a[key], bv = b[key];
      if (av == null && bv == null) return 0;
      if (av == null) return 1;   // nulls always last
      if (bv == null) return -1;
      if (typeof av === "string" || typeof bv === "string") return String(av).localeCompare(String(bv)) * d;
      return av > bv ? d : (av < bv ? -d : 0);
    }

    /* =========================================================================
       5. SHARED BLOCKS — skeleton, error/forbidden/empty cards
       ========================================================================= */
    function renderSkeleton() {
      return `
        <div class="kpi-grid" aria-busy="true" aria-label="Loading">
          ${Array.from({ length: 6 }).map(() => `
            <div class="kpi-card">
              <div class="skeleton" style="height:12px;width:60%;"></div>
              <div class="skeleton" style="height:28px;width:75%;margin-top:4px;"></div>
              <div class="skeleton" style="height:12px;width:50%;"></div>
            </div>
          `).join("")}
        </div>
        <div class="grid-charts-main">
          <div class="card"><div class="skeleton" style="height:280px;width:100%;"></div></div>
          <div class="card"><div class="skeleton" style="height:280px;width:100%;"></div></div>
        </div>
      `;
    }

    function renderForbiddenCard() {
      const first = allowedScreens()[0];
      return `
        <div class="empty-state" role="alert">
          <div class="empty-icon">${iconSvg("lock", 22)}</div>
          <div>
            <h2 style="margin:0 0 6px 0;font-size:16px;">Your role can't see this page</h2>
            <p style="margin:0;color:var(--text-muted);max-width:480px;">You're signed in as <strong>${esc(userRole() || "—")}</strong>. Ask an admin if you need access.</p>
          </div>
          ${first ? `<button class="btn btn-primary" onclick="navigate('#/${first}')">Go to ${esc(SCREEN_TITLES[first] || first)}</button>` : ""}
        </div>
      `;
    }

    function renderErrorCard(err, key, opts = {}) {
      if (err && err.status === 403) return renderForbiddenCard();
      if (err && err.status === 404) {
        return `
          <div class="empty-state">
            <div class="empty-icon">${iconSvg("alert", 22)}</div>
            <h2 style="margin:0;font-size:16px;">${esc(opts.notFoundTitle || "Not found")}</h2>
            <p style="margin:0;color:var(--text-muted);">${esc(err.message || "")}</p>
            ${opts.backHash ? `<button class="btn btn-primary" onclick="navigate('${opts.backHash}')">${esc(opts.backLabel || "Go back")}</button>` : ""}
          </div>
        `;
      }
      return `
        <div class="empty-state error-state" role="alert">
          <div class="empty-icon">${iconSvg("alert", 22)}</div>
          <div>
            <h2 style="margin:0 0 6px 0;font-size:16px;">Couldn't load this data</h2>
            <p style="margin:0;color:var(--text-muted);max-width:520px;">${esc((err && err.message) || "Unexpected error")}</p>
          </div>
          <button class="btn btn-primary" data-key="${esc(key)}" onclick="retryKey(this.dataset.key)">${iconSvg("refresh", 14)} Retry</button>
        </div>
      `;
    }

    /** Draws skeleton / error into `el` when `res` has no data yet. Returns true when the caller should stop. */
    function gate(el, res, key, opts) {
      if (res.data) return false;
      el.innerHTML = res.error ? renderErrorCard(res.error, key, opts) : renderSkeleton();
      return true;
    }

    function renderNoBatches() {
      return `
        <div class="empty-state">
          <div class="empty-icon">${iconSvg("calendar", 22)}</div>
          <div>
            <h2 style="margin:0 0 6px 0;font-size:16px;">No batches yet</h2>
            <p style="margin:0;color:var(--text-muted);max-width:480px;">
              ${isAdmin()
                ? "Create the first 7-week batch (it starts on a Sunday) and link its Zoom meetings — attendance appears here after the first sync."
                : "An admin needs to add the first batch before attendance can be shown."}
            </p>
          </div>
          ${isAdmin() ? `<button class="btn btn-primary" onclick="goAddFirstBatch()">Add your first batch</button>` : ""}
        </div>
      `;
    }

    function renderSyncBanner(boot) {
      if (state.bannerDismissed) return "";
      const failed = ((boot.sync && boot.sync.sources) || []).filter(s => s.status === "Sync failed");
      if (!failed.length) return "";
      const src = failed[0];
      return `
        <div class="alert-banner" role="alert">
          <div class="alert-banner-left">
            ${iconSvg("alert", 18)}
            <span><strong>${esc(src.name)} sync failed${failed.length > 1 ? ` (+${failed.length - 1} more)` : ""}:</strong> ${esc(src.errorMsg || "See Sync & Alerts for details.")}</span>
          </div>
          <div class="alert-banner-actions">
            ${canAccessHash("#/sync") ? `<button class="btn btn-sm" onclick="navigate('#/sync')">Open Sync &amp; Alerts</button>` : ""}
            <button class="btn btn-sm" onclick="dismissBanner()">Dismiss</button>
          </div>
        </div>
      `;

    function renderAlertsList(alerts, variant) {
      if (!alerts.length) {
        return `<div style="font-size:13px;color:var(--text-muted);padding:8px 0;">Nothing needs attention right now.</div>`;
      }
      return `
        <div class="attention-list">
          ${alerts.map(al => `
            <div class="attention-item">
              <div style="min-width:0;flex:1;">
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:2px;flex-wrap:wrap;">
                  <span class="badge ${al.severity === "red" ? "badge-red" : "badge-amber"}">${al.severity === "red" ? (variant === "sync" ? "Failed" : "Critical") : (variant === "sync" ? "Alert" : "Watch")}</span>

    function renderTimelineBar(startTime, durationMin, segments, lateThreshold) {
      const dur = Math.max(1, Number(durationMin) || 1);
      const segs = Array.isArray(segments) ? segments : [];
      const endTime = addMinutesToTime(startTime, dur);
      const midTime = addMinutesToTime(startTime, Math.round(dur / 2));
      const totalPresent = segs.reduce((sum, seg) => sum + Math.max(0, seg.endMin - seg.startMin), 0);
      const lateLeftPct = Math.min(100, (lateThreshold / dur) * 100);

      return `
        <div class="timeline-drawer">
          <div class="timeline-header">
            <span><strong>Presence Timeline</strong> · ${segs.length} segment${segs.length === 1 ? "" : "s"} (${totalPresent} min present of ${dur} min)</span>
            <span style="font-size:11.5px;color:var(--text-muted);">Filled = present · Gap = absent · Dashed amber = +${esc(lateThreshold)}m late cutoff</span>
          </div>
          <div class="timeline-track" role="img" aria-label="Presence segments across the session">
            <div class="timeline-late-line" style="left:${lateLeftPct}%;" title="Late threshold (+${esc(lateThreshold)}m)"></div>
            ${segs.map((seg, i) => {
              const leftPct = Math.max(0, Math.min(100, (seg.startMin / dur) * 100));
              const widthPct = Math.max(1.2, Math.min(100 - leftPct, ((seg.endMin - seg.startMin) / dur) * 100));
              const tStart = addMinutesToTime(startTime, seg.startMin);
              const tEnd = addMinutesToTime(startTime, seg.endMin);
              return `
                <div class="timeline-seg" tabindex="0" style="left:${leftPct}%;width:${widthPct}%;">
                  <div class="timeline-seg-tooltip">Seg ${i + 1}: ${tStart} – ${tEnd} (${seg.endMin - seg.startMin}m)</div>
                </div>
              `;
            }).join("")}
          </div>
          <div class="timeline-axis">
            <span>${esc(startTime || "—")} (Start)</span>
            <span>${midTime} (+${Math.round(dur / 2)}m)</span>
            <span>${endTime} (End)</span>
          </div>
        </div>
      `;
    }

    function renderHeatStrip(weeks) {
      return `
        <div class="heat-strip" aria-label="Weekly attendance strip">
          ${(weeks || []).map(w => {
            const lbl = w.label != null ? w.label : w.week;

       6. SCREEN: OVERVIEW (#/overview) — Admin, Viewer

    /** Combines Phase 1 / Phase 2 summaries for the selected phase + region (sums counts, week by week). */
    function aggregatePhases(batch) {
      const ps = (batch.phaseSummary && (batch.phaseSummary[state.region] || batch.phaseSummary.All)) || {};
      const p1 = ps.p1 || null;
      const p2 = ps.p2 || null;
      const useP1 = state.phase !== "Phase 2" && !!p1;
      const useP2 = state.phase !== "Phase 1" && !!p2;
      const parts = [useP1 ? p1 : null, useP2 ? p2 : null].filter(Boolean);
      const sum = k => parts.reduce((t, p) => t + (Number(p[k]) || 0), 0);
      const weeks = batch.totalWeeks || 7;
      const offset2 = p2 && p2.weekOffset != null ? p2.weekOffset : P2_WEEK_OFFSET_FALLBACK;

      const weekly = [];
      for (let i = 0; i < weeks; i++) {
        const vals = parts.map(p => (p.weeklySundayAttended || [])[i]);
        weekly.push(vals.every(v => v == null) ? null : vals.reduce((t, v) => t + (v || 0), 0));
      }
      const retained = [];
      for (let i = 0; i < weeks; i++) {
        const vals = parts.map(p => (p.weeklyRetainedFromW1 || [])[i]);
        retained.push(vals.every(v => v == null) ? null : vals.reduce((t, v) => t + (v || 0), 0));
      }
      const newRet = [];
      for (let w = 1; w <= weeks; w++) {
        const entries = parts.map(p => (p.weeklyNewVsReturning || []).find(x => Number(x.week) === w)).filter(Boolean);
        newRet.push(entries.length ? {
          week: w,
          newCount: entries.reduce((t, e) => t + (e.newCount || 0), 0),
          returningCount: entries.reduce((t, e) => t + (e.returningCount || 0), 0)
        } : null);
      }
      const heldIdx = weekly.map((v, i) => (v == null ? -1 : i)).filter(i => i >= 0);
      const currentWeek = heldIdx.length ? heldIdx[heldIdx.length - 1] + 1 : 0;
      const withData = parts.filter(p => (p.currentWeek || 0) > 0);
      const avgOf = k => (withData.length ? Math.round(withData.reduce((t, p) => t + (Number(p[k]) || 0), 0) / withData.length) : null);

      return {
        p1, p2, parts, useP1, useP2, weeks, offset2,
        paid: sum("paid"),
        refunded: sum("refunded"),
        registered: sum("registered"),
        denominator: sum("denominator"),
        lateJoiners: sum("lateJoiners"),
        w1: sum("w1Attended"),
        w1Unmatched: parts.reduce((t, p) => t + (((p.weeklySundayUnmatched || [])[0]) || 0), 0),
        w1Synced: parts.every(p => p.w1Synced !== false),
        firstSyncedWeek: Math.min(...parts.map(p => p.firstSyncedWeek || 99)),
        weekly,
        retained,
        newRet,
        currentWeek,
        current: currentWeek ? weekly[currentWeek - 1] : null,
        avgMinutes: avgOf("avgMinutes"),
        stayed60Pct: avgOf("stayed60Pct")
      };
    }

    function renderOverview(el, ctx) {

      const { batch, prevBatch } = res.data;
