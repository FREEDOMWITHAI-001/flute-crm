                <h3 class="card-title">Thursday Q&amp;A</h3>
                <p class="card-subtitle">Shared Zoom · split by date${bothPhases ? " · P1 solid, P2 dashed" : ""}</p>
              </div>
              <span class="badge badge-slate">Q&amp;A</span>
            </div>
            <div class="chart-box-sm"><canvas id="chart-type-thu" aria-label="Thursday Q and A attendance rate" role="img"></canvas></div>
          </div>
        </section>
      `;

      el.innerHTML = html;
      renderOverviewCharts(batch, agg, prevBatch, meta);
    }

    function renderOverviewCharts(batch, agg, prevBatch, meta) {
      if (typeof window.Chart === "undefined") return;
      const gridColor = getCssVar("--chart-grid");
      const tickColor = getCssVar("--chart-tick");
      const accentColor = "#0F766E";
      const accentSoft = "rgba(15, 118, 110, 0.14)";
      const prevColor = getCssVar("--chart-prev");
      const labels = Array.from({ length: agg.weeks }, (_, i) => phaseWeekLabel(i + 1, agg.offset2));
      const legend = { position: "bottom", labels: { color: tickColor, boxWidth: 12, font: { size: 11 } } };

      const retentionSeries = agg.retained.map(v => (v != null && agg.w1 ? Math.round((v / agg.w1) * 100) : null));
      const datasets = [{
        label: `${batch.shortName} (% of week 1)`,
        data: retentionSeries,
        borderColor: accentColor,
        backgroundColor: accentSoft,
        fill: true,
        tension: 0.3,
        borderWidth: 2.5,
        pointRadius: 4,
        spanGaps: false
      }];
      if (meta.goalRetentionPct != null) {
        datasets.push({
          label: `Goal (${meta.goalRetentionPct}%)`,
          data: labels.map(() => meta.goalRetentionPct),
          borderColor: "#16A34A",
          borderDash: [6, 5],
          borderWidth: 1.5,
          pointRadius: 0,
          fill: false
        });
      }
      if (prevBatch && prevBatch.curve) {
        const addPrev = (arr, label, dash) => {
          if (!Array.isArray(arr) || !arr.some(v => v != null)) return;
          datasets.push({ label, data: arr.slice(0, agg.weeks), borderColor: prevColor, borderDash: dash, borderWidth: 1.5, pointRadius: 2, fill: false, tension: 0.3, spanGaps: false });
        };
        if (agg.useP1 && agg.useP2) {
          addPrev(prevBatch.curve.p1, `${prevBatch.shortName} · Phase 1`, [3, 3]);
          addPrev(prevBatch.curve.p2, `${prevBatch.shortName} · Phase 2`, [8, 4]);
        } else {
          addPrev(agg.useP1 ? prevBatch.curve.p1 : prevBatch.curve.p2, `Previous batch (${prevBatch.shortName})`, [3, 3]);
        }
      }

      const ctxRet = document.getElementById("chart-retention");
      if (ctxRet) {
        state.charts.retention = new Chart(ctxRet, {
          type: "line",
          data: { labels, datasets },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: "index", intersect: false },
            plugins: { legend, tooltip: { callbacks: { label: c => `${c.dataset.label}: ${c.parsed.y == null ? "—" : c.parsed.y + "%"}` } } },
            scales: {
              y: { min: 0, suggestedMax: 105, grid: { color: gridColor }, ticks: { color: tickColor, callback: v => v + "%" } },
              x: { grid: { display: false }, ticks: { color: tickColor } }
            }
          }
        });
      }

      const ctxNewRet = document.getElementById("chart-new-ret");
      if (ctxNewRet) {
        state.charts.newRet = new Chart(ctxNewRet, {
          type: "bar",
          data: {
            labels,
            datasets: [
              { label: "Returning", data: agg.newRet.map(x => (x ? x.returningCount : null)), backgroundColor: accentColor, borderRadius: 4 },
              { label: "New (first-time)", data: agg.newRet.map(x => (x ? x.newCount : null)), backgroundColor: "#F59E0B", borderRadius: 4 }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend },
            scales: {
              x: { stacked: true, grid: { display: false }, ticks: { color: tickColor } },
              y: { stacked: true, beginAtZero: true, grid: { color: gridColor }, ticks: { color: tickColor, precision: 0 } }
            }
          }
        });
      }

      const both = agg.useP1 && agg.useP2;
      [
        ["chart-type-sun", "sunday", accentColor],
        ["chart-type-tue", "tuesday", "#0284C7"],
        ["chart-type-thu", "thursday", "#7C3AED"]
      ].forEach(([canvasId, rateKey, color]) => {
        const el = document.getElementById(canvasId);
        if (!el) return;
        const sets = [];
        if (agg.useP1) sets.push({ label: "Phase 1", data: ((agg.p1.sessionTypeRates || {})[rateKey] || []).slice(0, agg.weeks), borderColor: color, backgroundColor: "transparent", borderWidth: 2, pointRadius: 3, tension: 0.3, spanGaps: false });
        if (agg.useP2) sets.push({ label: "Phase 2", data: ((agg.p2.sessionTypeRates || {})[rateKey] || []).slice(0, agg.weeks), borderColor: color, borderDash: both ? [5, 4] : [], backgroundColor: "transparent", borderWidth: 2, pointRadius: 3, tension: 0.3, spanGaps: false });
        state.charts[canvasId] = new Chart(el, {
          type: "line",
          data: { labels: labels.map(l => l.replace(" · ", "/")), datasets: sets },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => `${c.dataset.label}: ${c.parsed.y == null ? "—" : c.parsed.y + "%"}` } } },
            scales: {
              y: { min: 0, suggestedMax: 100, grid: { color: gridColor }, ticks: { color: tickColor, stepSize: 25, callback: v => v + "%" } },
              x: { grid: { display: false }, ticks: { color: tickColor } }
            }
          }
        });
      });
    }

    /* =========================================================================
       7. SCREEN: SESSIONS (#/sessions) — Admin
       ========================================================================= */
    function sessionStatusNote(s) {
      if (s.status === "Upcoming") {
        return `<div style="font-size:12px;color:var(--text-muted);padding-top:6px;border-top:1px solid var(--border-subtle);">Upcoming · ${fmtNum(s.registered)} registered</div>`;
      }
      if (s.status === "Sync failed") {
        return `<div style="font-size:12px;color:var(--red);padding-top:6px;border-top:1px solid var(--border-subtle);">Sync failed${s.syncError ? `: ${esc(s.syncError)}` : ""} · <a href="#/sync">Retry sync</a></div>`;
      }
      if (s.status === "Not in Zoom") {
        return `<div style="font-size:12px;color:var(--text-muted);padding-top:6px;border-top:1px solid var(--border-subtle);">Ran before Zoom tracking started · will fill in when the old dashboard data is imported</div>`;
      }
      if (s.status === "Awaiting data") {
        return `<div style="font-size:12px;color:var(--amber);padding-top:6px;border-top:1px solid var(--border-subtle);">Session date has passed — Zoom report not pulled yet · <a href="#/sync">Sync now</a></div>`;
      }
      return "";
    }

    // How a session reads to a person: a past date with nothing in Zoom is simply "No session"
    function addDaysStr(d, n) {
      const t = new Date(d + "T00:00:00Z");
      t.setUTCDate(t.getUTCDate() + n);
      return t.toISOString().slice(0, 10);
    }
    function sessionState(s, today) {
      if (s.status === "Synced" || s.status === "Upcoming" || s.status === "Sync failed") return s.status;
      if (s.status === "Not in Zoom") return "No session";
      return today && s.date < addDaysStr(today, -1) ? "No session" : "Awaiting data";
    }
    const SESS_STATE_DOT = { Synced: "var(--green)", Upcoming: "var(--text-disabled)", "No session": "var(--border-strong)", "Awaiting data": "var(--amber)", "Sync failed": "var(--red)" };
    const SESS_STATES = ["Synced", "Upcoming", "No session", "Awaiting data", "Sync failed"];
    const SESS_TYPES = ["Sunday Learning", "Tuesday Practice", "Thursday Q&A"];
    const hostOf = (boot, s) => s.hostEmail || accountLabel(boot, s.zoomAccount);

    function renderSessions(el, ctx) {
      const { boot } = ctx;
      if (!(boot.batches || []).length) { el.innerHTML = renderNoBatches(); return; }
      const key = "sessions:" + state.batchId;
      const res = need(key, () => getJSON(`/api/batches/${state.batchId}/sessions`));
      if (gate(el, res, key)) return;
      const rules = boot.rules || {};
      const today = boot.meta && boot.meta.today;
      const all = (res.data.sessions || []).map(s => ({ ...s, view: sessionState(s, today), host: hostOf(boot, s) }));

      if (!all.length) {
        el.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">${iconSvg("calendar", 22)}</div>
            <div>
              <h2 style="margin:0 0 6px 0;font-size:16px;">No Zoom meetings linked to this batch yet</h2>
              <p style="margin:0;color:var(--text-muted);">Once the Sunday learning and Tue/Thu practice links are added, every session appears here.</p>
            </div>
            <button class="btn btn-primary" onclick="navigate('#/settings')">Link meetings in Settings</button>
          </div>`;
        return;
      }

      const f = state.sessFilter;
      const hosts = [...new Set(all.map(s => s.host))].sort();
      const inPhase = s => state.phase === "All" || s.phase === state.phase;
      const pass = s => inPhase(s)
        && (f.type === "All" || s.type === f.type)
        && (f.status === "All" || s.view === f.status)
        && (f.host === "All" || s.host === f.host);
      const shown = all.filter(pass);
      const count = st => all.filter(s => inPhase(s) && s.view === st).length;
      const opt = (val, label, cur) => `<option value="${esc(val)}" ${cur === val ? "selected" : ""}>${esc(label)}</option>`;
      const filtersOn = f.type !== "All" || f.status !== "All" || f.host !== "All";
      const openHash = s => `#/session/${encodeURIComponent(s.id)}`;

      let html = `
        <section class="card" style="display:flex;flex-direction:column;gap:12px;">
          <div class="toolbar" style="margin:0;">
            <div class="sess-filters">
              <select class="select-control" aria-label="Session type" onchange="setSessFilter('type', this.value)">
                ${opt("All", "All session types", f.type)}${SESS_TYPES.map(t => opt(t, t, f.type)).join("")}
              </select>
              <select class="select-control" aria-label="Status" onchange="setSessFilter('status', this.value)">
                ${opt("All", "All statuses", f.status)}${SESS_STATES.map(t => opt(t, t, f.status)).join("")}
              </select>
              <select class="select-control" aria-label="Zoom account" onchange="setSessFilter('host', this.value)">
                ${opt("All", "All Zoom accounts", f.host)}${hosts.map(h => opt(h, h, f.host)).join("")}
              </select>
              ${filtersOn ? `<button class="btn btn-sm" onclick="clearSessFilters()">Clear filters</button>` : ""}
            </div>
            <div class="segmented" role="tablist" aria-label="Sessions view mode">
              <button class="seg-btn ${state.sessionsView === "calendar" ? "active" : ""}" role="tab" aria-selected="${state.sessionsView === "calendar"}" onclick="setSessionsView('calendar')">Weekly grid</button>
              <button class="seg-btn ${state.sessionsView === "table" ? "active" : ""}" role="tab" aria-selected="${state.sessionsView === "table"}" onclick="setSessionsView('table')">Table</button>
            </div>
          </div>
          <div class="sess-chips">
            ${SESS_STATES.filter(st => count(st)).map(st => `<button class="sess-chip" onclick="setSessFilter('status', '${esc(st)}')" title="Show only ${esc(st)}"><span class="sess-dot" style="background:${SESS_STATE_DOT[st]}"></span>${esc(st)} <b>${fmtNum(count(st))}</b></button>`).join("")}
            <span class="sess-chip">${iconSvg("video", 13)} Zoom: <b>${esc(hosts.join(", "))}</b></span>
          </div>
        </section>`;

      if (!shown.length) {
        html += `
          <div class="empty-state">
            <h2 style="margin:0;font-size:16px;">No sessions match these filters</h2>
            <button class="btn btn-primary" onclick="clearSessFilters()">Clear filters</button>
          </div>`;
        el.innerHTML = html;
        return;
      }

      if (state.sessionsView === "calendar") {
        const types = SESS_TYPES.filter(t => f.type === "All" || t === f.type);
        const phases = ["Phase 1", "Phase 2"].filter(p => state.phase === "All" || p === state.phase);
        const cell = s => {
          if (!s) return `<td class="sess-cell"><span class="sess-state">—</span></td>`;
          const dim = pass(s) ? "" : "dim";
          const when = `${s.day} ${fmtDate(s.date)}`;
          if (s.view !== "Synced") {
            const warn = s.view === "Awaiting data" || s.view === "Sync failed";
            const note = s.view === "No session" ? "Nothing in Zoom on this date"
              : s.view === "Upcoming" ? `${fmtNum(s.registered)} registered`
              : s.view === "Sync failed" ? "Retry from Sync & Alerts" : "Report not pulled yet";
            return `
              <td class="sess-cell ${dim}" title="${esc(s.type)} · ${esc(when)}">
                <div class="sess-state ${warn ? "warn" : ""}"><span class="sess-dot" style="background:${SESS_STATE_DOT[s.view]}"></span>${esc(s.view)}</div>
                <div class="sess-sub">${esc(when)} · ${esc(note)}</div>
              </td>`;
          }
          const paidN = s.paidAttended ?? s.attended;
          const pct = s.cohort ? Math.round((paidN / s.cohort) * 100) : null;
          return `
            <td class="sess-cell open ${dim}" role="link" tabindex="0" data-hash="${esc(openHash(s))}" onclick="navigate(this.dataset.hash)" onkeydown="if(event.key==='Enter')navigate(this.dataset.hash)" title="${esc(s.type)} · ${esc(when)} · ${esc(s.host)}">
              <div class="sess-num">${fmtNum(paidN)}${pct != null ? ` <span>${pct}%</span>` : ""}</div>
              <div class="sess-sub" title="Unmatched = no paid learner found · other phase = paid learners who belong to the other phase">${esc(when)} · ${fmtNum(s.joined)} joined${s.unmatchedAttended ? ` · +${fmtNum(s.unmatchedAttended)} unmatched` : ""}${s.otherPhaseAttended ? ` · +${fmtNum(s.otherPhaseAttended)} other phase` : ""}</div>
              <div class="sess-bar"><i style="width:${Math.min(100, pct ?? 0)}%"></i></div>
            </td>`;
        };
        for (const phase of phases) {
          const ps = all.filter(s => s.phase === phase && (f.host === "All" || s.host === f.host));
          if (!ps.length) continue;
          const weeks = [...new Set(ps.map(s => s.week))].sort((x, y) => x - y);
          const first = ps.find(s => s.type === "Sunday Learning") || ps[0];
          const p1 = phase === "Phase 1";
          html += `
            <section class="card">
              <div class="sess-phase-head">
                <div>
                  <h2 class="card-title">${p1 ? "Phase 1 · Straight Flute" : "Phase 2 · Side Flute"}
                    <span class="badge ${p1 ? "badge-teal" : "badge-blue"}" style="margin-left:6px;">${p1 ? "Weeks 1–7 · new cohort" : "Weeks 8–14 · previous cohort"}</span>
                  </h2>
                  <p class="card-subtitle">Sunday ${esc(timeOrTbc(first.startTime))} · big number = paid learners attending ${esc(rules.attendedMinMinutes)}+ min · % of the phase's paid learners</p>
                </div>
                <span class="sess-host">${iconSvg("video", 13)} ${esc([...new Set(ps.map(s => s.host))].join(", "))}</span>
              </div>
              <div class="sess-scroll">
                <table class="sess-grid">
                  <thead><tr><th class="wk">Week</th>${types.map(t => `<th>${esc(t)}</th>`).join("")}</tr></thead>
                  <tbody>
                    ${weeks.map(w => {
                      const row = ps.filter(s => s.week === w);
                      const sun = row.find(s => s.type === "Sunday Learning") || row[0];
                      return `<tr><td><div class="sess-wk">W${esc(sun.weekLabel)}<small>${esc(fmtDate(sun.date))}</small></div></td>${types.map(t => cell(row.find(s => s.type === t))).join("")}</tr>`;
                    }).join("")}
                  </tbody>
                </table>
              </div>
            </section>`;
        }
      } else {
        const sorted = [...shown].sort((x, y) => cmp(x, y, state.sessionsSort.key, state.sessionsSort.dir) || cmp(x, y, "slot", "asc"));
        const sortAttr = k => (state.sessionsSort.key === k ? `aria-sort="${state.sessionsSort.dir === "asc" ? "ascending" : "descending"}"` : "");
        html += `
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th class="sortable" ${sortAttr("date")} onclick="sortSessions('date')">Date</th>
                  <th>Session</th>
                  <th>Phase</th>
                  <th>Zoom account</th>
                  <th>Status</th>
                  <th class="num sortable" ${sortAttr("registered")} onclick="sortSessions('registered')">Registered</th>
                  <th class="num sortable" ${sortAttr("joined")} onclick="sortSessions('joined')">Joined</th>
                  <th class="num sortable" ${sortAttr("attended")} onclick="sortSessions('attended')">Attended (${esc(rules.attendedMinMinutes)}+)</th>
                  <th class="num sortable" ${sortAttr("avgMinutes")} onclick="sortSessions('avgMinutes')">Avg min</th>
                  <th class="num sortable" ${sortAttr("peakConcurrent")} onclick="sortSessions('peakConcurrent')">Peak</th>
                  <th class="num">% Late</th>
                  <th class="num">% Left early</th>
                </tr>
              </thead>
              <tbody>
                ${sorted.map(s => {
                  const canOpen = s.view === "Synced";
                  return `
                    <tr class="${canOpen ? "clickable-row" : ""}" ${canOpen ? `data-hash="${esc(openHash(s))}" onclick="navigate(this.dataset.hash)"` : ""}>
                      <td class="tabular"><strong>W${esc(s.weekLabel)}</strong> · ${esc(s.day)} ${esc(fmtDate(s.date))}</td>
                      <td>${canOpen ? `<a href="${esc(openHash(s))}" onclick="event.stopPropagation()"><strong>${esc(s.type)}</strong></a>` : `<strong>${esc(s.type)}</strong>`}<div class="sub-cell">${esc(timeOrTbc(s.startTime))}</div></td>
                      <td>${esc(s.phase)}</td>
                      <td style="font-size:12px;color:var(--text-muted);">${esc(s.host)}<div class="sub-cell">ID ${esc(s.meetingId || "—")}</div></td>
                      <td><span class="sess-chip" style="padding:2px 8px;"><span class="sess-dot" style="background:${SESS_STATE_DOT[s.view]}"></span>${esc(s.view)}</span></td>
                      <td class="num">${fmtNum(s.registered)}</td>
                      <td class="num">${canOpen ? fmtNum(s.joined) : "—"}</td>
                      <td class="num">${canOpen && s.attended != null ? `<strong>${fmtNum(s.paidAttended ?? s.attended)}</strong> (${fmtPct(s.paidAttended ?? s.attended, s.cohort || s.registered)})${s.unmatchedAttended ? `<div class="sub-cell">+${fmtNum(s.unmatchedAttended)} unmatched</div>` : ""}` : "—"}</td>
                      <td class="num">${canOpen && s.avgMinutes != null ? s.avgMinutes + "m" : "—"}</td>
                      <td class="num">${canOpen ? fmtNum(s.peakConcurrent) : "—"}</td>
                      <td class="num">${canOpen && s.pctLate != null ? s.pctLate + "%" : "—"}</td>
                      <td class="num">${canOpen && s.pctLeftEarly != null ? s.pctLeftEarly + "%" : "—"}</td>
                    </tr>`;
                }).join("")}
              </tbody>
            </table>
          </div>`;
      }

      el.innerHTML = html;
    }

    /* =========================================================================
       8. SCREEN: SESSION DETAIL (#/session/:id) — Admin
       ========================================================================= */
    function renderSessionDetail(el, ctx) {
      const { boot, param } = ctx;
      const key = "session:" + param;
      const res = need(key, () => getJSON(`/api/sessions/${encodeURIComponent(param)}`));
      if (gate(el, res, key, { notFoundTitle: "Session not found", backHash: "#/sessions", backLabel: "Back to Sessions" })) return;
      const s = res.data;
      const rules = boot.rules || {};
      const participantsAll = s.participants || [];
      const curve = s.attendanceOverTime || [];
      const hasTime = !!s.startTime;
      const endTimeStr = hasTime ? addMinutesToTime(s.startTime, s.durationMin) : null;
      const q = state.sessionParticipantSearch.trim().toLowerCase();
      const filtered = participantsAll.filter(p =>
        !q || String(p.zoomName || "").toLowerCase().includes(q) || String(p.zoomEmail || "").toLowerCase().includes(q) || String(p.learnerName || "").toLowerCase().includes(q)
      ).sort((a, b) => cmp(a, b, state.sessionParticipantSort.key, state.sessionParticipantSort.dir));
      const shown = state.sessionShowAll ? filtered : filtered.slice(0, PARTICIPANT_CAP);
      const leftEarlyCut = (s.durationMin || 0) - (rules.leftEarlyMinutes || 0);
      const sortAttr = k => (state.sessionParticipantSort.key === k ? `aria-sort="${state.sessionParticipantSort.dir === "asc" ? "ascending" : "descending"}"` : "");

      let html = `
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;">
          <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
            <button class="btn btn-sm" onclick="navigate('#/sessions')">${iconSvg("chevronLeft", 14)} Sessions</button>
            <div>
              <h2 style="margin:0;font-size:17px;">Week ${esc(s.weekLabel)} · ${esc(s.type)} (${esc(s.phase)})</h2>
              <div style="font-size:12.5px;color:var(--text-muted);">
                ${esc(s.day)} ${esc(fmtDate(s.date))} · ${hasTime ? `${esc(s.startTime)}–${esc(endTimeStr)} IST` : "Time TBC"} · Meeting ID ${esc(s.meetingId || "—")} · ${esc(s.zoomAccountLabel || accountLabel(boot, s.zoomAccount))}
              </div>
            </div>
          </div>
          ${statusBadge(s.status)}
        </div>
      `;

      if (s.status !== "Synced") {
        html += `
          <div class="empty-state">
            <div class="empty-icon">${iconSvg("clock", 22)}</div>
            <h2 style="margin:0;font-size:16px;">No attendance data for this session yet</h2>
            <p style="margin:0;color:var(--text-muted);">${s.status === "Sync failed" && s.syncError ? esc(s.syncError) : "It appears here once the Zoom report has been synced."}</p>
          </div>`;
        el.innerHTML = html;
        return;
      }

      html += `
        <section class="kpi-grid">
          <div class="kpi-card">
            <div class="kpi-label">Attended (${esc(rules.attendedMinMinutes)}+ min)</div>
            <div class="kpi-value-row"><span class="kpi-primary tabular">${fmtPct(s.paidAttended ?? s.attended, s.cohort || s.registered)}</span><span class="kpi-counts">${fmtNum(s.paidAttended ?? s.attended)} of ${fmtNum(s.cohort || s.registered)} paid learners${s.unmatchedAttended ? ` · +${fmtNum(s.unmatchedAttended)} unmatched` : ""}</span></div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Joined Zoom</div>
            <div class="kpi-value-row"><span class="kpi-primary tabular">${fmtNum(s.joined)}</span><span class="kpi-counts">people · ${fmtNum(s.registered)} registered on Zoom</span></div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Avg Minutes · Peak</div>
            <div class="kpi-value-row"><span class="kpi-primary tabular">${s.avgMinutes == null ? "—" : s.avgMinutes + "m"}</span><span class="kpi-counts">Peak ${fmtNum(s.peakConcurrent)} concurrent</span></div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Late (&gt;${esc(rules.lateThresholdMinutes)}m) · Left early (&gt;${esc(rules.leftEarlyMinutes)}m before end)</div>

    function filteredLearners(all) {
      const f = state.learnersFilter;
      const q = f.search.trim().toLowerCase();
      return all.filter(l => {
        if (!matchesPhaseRegion(l)) return false;
        if (q && !(String(l.name || "").toLowerCase().includes(q) || String(l.email || "").toLowerCase().includes(q) || String(l.phone || "").toLowerCase().includes(q))) return false;
        if (f.status !== "All" && l.status !== f.status) return false;
        if (f.regular === "Yes" && !l.isRegular) return false;
        if (f.regular === "No" && l.isRegular) return false;
        if (f.missedTwice === "Yes" && !l.isMissedTwice) return false;
        if (f.missedTwice === "No" && l.isMissedTwice) return false;
        return true;
      }).sort((a, b) => cmp(a, b, f.sortKey, f.sortDir) || cmp(a, b, "name", "asc"));
    }

                    <div style="padding:10px 12px;border:1px solid var(--border-subtle);border-radius:8px;background:var(--bg-canvas);">
                      <div style="font-weight:600;font-size:13px;">${esc(h.batch)}</div>
                      <div style="font-size:12.5px;color:var(--text-secondary);">${esc(h.event)}</div>
                      <div style="font-size:11.5px;color:var(--text-muted);">${esc(fmtDate(h.date))}</div>
                    </div>
                  `).join("")}
                </div>` : `<div style="font-size:12.5px;color:var(--text-muted);">No batch history yet.</div>`}
            </div>

            <div class="card">
              <div class="card-header" style="margin-bottom:10px;">
                <h3 class="card-title">Zoom Matching Info</h3>
              </div>
              <p style="margin:0 0 10px 0;font-size:13px;color:var(--text-secondary);">${esc(MATCH_LABELS[l.matchMethod] || MATCH_LABELS.none)}</p>
              ${linked.length ? `
                <div style="display:flex;flex-direction:column;gap:6px;">
                  ${linked.map(z => `
                    <div style="font-size:12.5px;padding:8px 10px;border:1px solid var(--border-subtle);border-radius:8px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;">
                      <span><strong>${esc(z.zoomName)}</strong>${z.zoomEmail ? ` · ${esc(z.zoomEmail)}` : ""}</span>
                      <span class="badge badge-slate">${esc(z.via || "—")}</span>
                    </div>
                  `).join("")}
                </div>
              ` : `<div style="font-size:12.5px;color:var(--text-muted);">No linked Zoom display names yet.</div>`}

        </section>
      `;

      el.innerHTML = html;

    /* =========================================================================
       11. SCREEN: LISTS (#/lists) — Export CSV & Copy numbers only (nothing is sent)
       ========================================================================= */
    function renderLists(el, ctx) {
      const { boot } = ctx;
      if (!(boot.batches || []).length) { el.innerHTML = renderNoBatches(); return; }
      const key = "lists:" + state.batchId;
      const res = need(key, () => getJSON(`/api/batches/${state.batchId}/lists`));
      if (gate(el, res, key)) return;
      const lists = res.data;
      const rules = boot.rules || {};
      const pick = arr => (arr || []).filter(matchesPhaseRegion);
      const typesText = arr => (arr && arr.length ? arr.join(" / ") : "Sunday Learning");

      const diamondAll = pick(lists.diamondShowcase);
      const tabs = [
        {
          id: "missed_twice", label: `Call list · missed ${rules.missedTwiceCount} Sundays`, rows: pick(lists.missedTwice),
          ruleText: `Attended before, then missed the last ${rules.missedTwiceCount}–${Number(rules.missedTwiceCount) + 1} ${typesText(rules.missedTwiceSessionTypes)} sessions in a row (under ${rules.attendedMinMinutes} min). Only synced sessions count — a session with no Zoom report is never a miss. Excludes refunded, do-not-contact and late joiners. "Came to practice" = attended a Tue/Thu since their last Sunday.`
        },
        {
          id: "dropped_off", label: "Dropped off (4+ missed)", rows: pick(lists.droppedOff),
          ruleText: `Attended before, but missed ${Number(rules.missedTwiceCount) + 2}+ ${typesText(rules.missedTwiceSessionTypes)} sessions in a row — not on the call list. Review separately.`
        },
        {
          id: "diamond", label: "Diamond Showcase", rows: diamondAll.slice(0, Math.max(1, state.diamondInviteLimit)), totalBeforeLimit: diamondAll.length,
          ruleText: `Most regular learners: ${rules.regularStreakWeeks}+ ${typesText(rules.regularSessionTypes)} sessions in a row with ≥${rules.regularMinMinutes} min each, ranked by regularity score.`
        },
        {
          id: "active_only", label: "Active only", rows: pick(lists.activeOnly), crossBatch: true,
          ruleText: `Everyone who attended any session in the last ${rules.activeWindowDays} days — across ALL batches, not just the selected one. Excludes refunded and do-not-contact.`
        },
        {
          id: "late_joiners", label: "Late joiners → next batch", rows: pick(lists.lateJoiners),
          ruleText: "First attended in week 2 or later — should restart at week 1 of the next batch (or already moved)."
        },
        {
          id: "not_paid", label: "Attended but not paid", rows: pick(lists.notPaid), zoomRows: true,
          ruleText: `Zoom participants who attended (≥${rules.attendedMinMinutes} min) but match no paid learner.`
        },
        {
          id: "dnc", label: "Do-not-contact", rows: pick(lists.doNotContact),
          ruleText: "Always excluded from every outreach list above."
        }
      ];

      const activeTab = tabs.find(t => t.id === state.listsTab) || tabs[0];
      const q = state.listsSearch.trim().toLowerCase();
      const visibleRows = activeTab.rows.filter(r => {
        if (!q) return true;
        const name = String(r.name || r.zoomName || "").toLowerCase();
        const email = String(r.email || r.zoomEmail || "").toLowerCase();
        const phone = String(r.phone || "").toLowerCase();
        return name.includes(q) || email.includes(q) || phone.includes(q);
      });
      const listsPg = pageOf(visibleRows, state.listsLimit, LIST_PAGE);
      const shown = listsPg.rows;
      window.__currentListData = { tab: activeTab, rows: visibleRows };
      const filterNote = (state.phase !== "All" || state.region !== "All") ? ` · Filtered to ${[state.phase !== "All" ? state.phase : "", state.region !== "All" ? state.region : ""].filter(Boolean).join(" · ")}` : "";

      let html = `
        <div class="card" style="padding-bottom:0;">
          <div class="tabs-bar" role="tablist" aria-label="Actionable learner lists">
            ${tabs.map(t => `
              <button class="tab-btn ${t.id === activeTab.id ? "active" : ""}" role="tab" aria-selected="${t.id === activeTab.id}" onclick="setListsTab('${t.id}')">
                <span>${esc(t.label)}</span>
                <span class="tab-count">${fmtNum(t.id === "diamond" ? t.totalBeforeLimit : t.rows.length)}</span>
              </button>
            `).join("")}
          </div>

          <div style="padding:16px 0;display:flex;flex-direction:column;gap:14px;">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;">
              <div>
                <div style="font-size:13.5px;font-weight:500;color:var(--text-primary);">${esc(activeTab.ruleText)}</div>
                <div style="font-size:12px;color:var(--text-muted);margin-top:2px;">
                  ${activeTab.id !== "dnc" && activeTab.id !== "not_paid" ? `Excluded (do-not-contact): <strong>${fmtNum(lists.dncExcludedCount)}</strong> · ` : ""}
                  Export-only list (no messages are sent from this tool)${esc(filterNote)}
                </div>
              </div>
              <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                ${activeTab.id === "diamond" ? `
                  <label style="font-size:12.5px;display:inline-flex;align-items:center;gap:6px;" for="diamond-limit">
                    <span>How many to invite:</span>
                    <input id="diamond-limit" type="number" min="1" max="5000" class="input-control" style="width:84px;height:32px;" value="${state.diamondInviteLimit}" onchange="setDiamondLimit(this.value)" />
                  </label>
                  <span style="font-size:12px;color:var(--text-muted);">of ${fmtNum(activeTab.totalBeforeLimit)} qualifying</span>
                ` : ""}
                <input type="search" id="lists-search" class="search-input" style="height:32px;" placeholder="Filter list..." aria-label="Filter this list" value="${esc(state.listsSearch)}" oninput="setListsSearch(this.value)" />
                <button class="btn btn-sm" onclick="copyCurrentListNumbers()">${iconSvg("copy", 14)} Copy numbers</button>
                <button class="btn btn-primary btn-sm" onclick="exportCurrentListCSV()">${iconSvg("download", 14)} Export CSV</button>
              </div>
            </div>
          </div>
        </div>
      `;

      if (!visibleRows.length) {
        html += `
          <div class="empty-state">
            <div class="empty-icon">${iconSvg("list", 22)}</div>
            <h3 style="margin:0;">No records in "${esc(activeTab.label)}"</h3>
            <p style="margin:0;color:var(--text-muted);">${q ? "Try a different search." : "Nobody qualifies for this list right now (with the current phase/region filters)."}</p>
          </div>
        `;
      } else if (activeTab.zoomRows) {
        html += `
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Zoom Display Name</th>
                  <th>Zoom Email</th>
                  <th>Phone</th>
                  <th>Phase</th>
                  <th class="num">Sessions Attended</th>
                  <th class="num">Total Minutes</th>
                  <th>Last Seen</th>
                  <th>Note</th>
                </tr>
              </thead>
              <tbody>
                ${shown.map(r => `
                  <tr>
                    <td class="name-cell">${esc(r.zoomName)}</td>
                    <td>${esc(r.zoomEmail || "—")}</td>
                    <td class="tabular">${esc(r.phone || "—")}</td>
                    <td>${esc(r.phase)}</td>
                    <td class="num">${fmtNum(r.sessionsAttended)}</td>
                    <td class="num">${fmtNum(r.totalMinutes)}m</td>
                    <td class="tabular">${esc(fmtDate(r.lastSeen))}</td>
                    <td>${r.note ? `<span class="badge badge-amber">${esc(r.note)}</span>` : ""}</td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        `;
      } else {
        html += `
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Learner</th>
                  <th>Phone</th>
                  <th>Email</th>
                  <th>Country</th>
                  ${activeTab.crossBatch ? "<th>Batch</th>" : ""}
                  <th>Phase</th>
                  <th>Status</th>
                  <th class="num">Regularity</th>
                  <th class="num">Total Min</th>
                  <th>Last Attended</th>
                  <th>Last call</th>
                  <th></th>
                </tr>
              </thead>
              <tbody>
                ${shown.map(l => {
                  const b = activeTab.crossBatch ? batchById(boot, l.batchId) : null;
                  const call = (res.data.calls || {})[l.id];
                  const admin = isAdmin();
                  return `
                    <tr class="${admin ? "clickable-row" : ""}" ${admin ? `onclick="navigate('#/learner/${Number(l.id)}')"` : ""}>
                      <td class="name-cell" title="${esc(l.name)}">${esc(l.name)}${l.practiceSinceLastSunday && activeTab.id === "missed_twice" ? `<span class="tag-soft" title="Attended a Tue/Thu practice after their last Sunday">came to practice</span>` : ""}</td>
                      <td class="tabular" style="white-space:nowrap;">${esc(l.phone || "—")}</td>
                      <td class="email-cell">${esc(l.email || "—")}</td>
                      <td>${esc(l.country || "—")}</td>
                      ${activeTab.crossBatch ? `<td>${esc(b ? b.shortName : "—")}</td>` : ""}
                      <td>${esc(l.phase)}</td>
                      <td>${statusBadge(l.status)}</td>
                      <td class="num"><strong>${fmtNum(l.regularityScore)}</strong></td>
                      <td class="num">${fmtNum(l.totalMinutes)}m</td>
                      <td style="font-size:12px;color:var(--text-muted);white-space:nowrap;">${esc(l.lastAttended)}</td>
                      <td class="call-cell">${call ? `${esc(call.outcome)}<div class="sub-cell">${esc(fmtDate(String(call.calledAt).slice(0, 10)))} · ${esc(call.callerName || "")}${call.callCount > 1 ? ` · ${fmtNum(call.callCount)} calls` : ""}${call.followUp ? ` · follow up ${esc(fmtDate(call.followUp))}` : ""}</div>` : `<span style="color:var(--text-muted);">Not called</span>`}</td>
                      <td><button class="btn btn-sm" onclick="event.stopPropagation(); openCallDialog(${Number(l.id)}, ${Number(l.batchId) || "null"}, '${esc(l.phase)}')">Log call</button></td>
                    </tr>
                  `;
                }).join("")}
              </tbody>
            </table>
          </div>
        `;
      }

      html += pagerHtml(visibleRows.length, listsPg, LIST_PAGE, "gotoListsPage");

      el.innerHTML = html;
    }

    /* =========================================================================
       12. SCREEN: REVIEW QUEUE (#/review) — Admin
       ========================================================================= */
    function reviewResultsHtml(idx, item) {
      const st = state.reviewSearch[item.id];
      if (!st || st.q.trim().length < 2) return "";
      const busy = state.reviewBusy.has(item.id);
      let inner;
      if (st.loading) inner = `<div style="padding:8px 10px;font-size:12px;color:var(--text-muted);"><span class="spinner" aria-hidden="true"></span> Searching…</div>`;
      else if (st.error) inner = `<div style="padding:8px 10px;font-size:12px;color:var(--red);">${esc(st.error)}</div>`;
      else if (st.results && st.results.length) {
        inner = st.results.map(r => `
          <button type="button" class="role-option" style="padding:7px 10px;" ${busy ? "disabled" : ""} onclick="resolveReview(${idx}, 'match', ${Number(r.id)})">
            <div style="min-width:0;">
              <span class="role-option-title" style="font-size:12.5px;">${esc(r.name)}</span>
              <span class="role-option-desc">${esc([r.phone, r.email].filter(Boolean).join(" · ") || "No contact details")}</span>
            </div>
            <span class="badge badge-teal">Match</span>
          </button>`).join("");
      } else if (st.results) inner = `<div style="padding:8px 10px;font-size:12px;color:var(--text-muted);">No learner matches "${esc(st.q)}"</div>`;
      else inner = "";
      return inner ? `<div style="margin-top:4px;max-height:200px;overflow-y:auto;border:1px solid var(--border-subtle);border-radius:8px;background:var(--bg-canvas);">${inner}</div>` : "";
    }

    function updateReviewResults(identityKey) {
      const items = window.__reviewItems || [];
      const idx = items.findIndex(x => x.id === identityKey);
      if (idx < 0) return;
      const box = document.getElementById(`review-results-${idx}`);
      if (box) box.innerHTML = reviewResultsHtml(idx, items[idx]);
    }

    function renderReviewQueue(el, ctx) {
      const { boot } = ctx;
      if (!(boot.batches || []).length) { el.innerHTML = renderNoBatches(); return; }
      const key = "review:" + state.batchId;
      const res = need(key, () => getJSON(`/api/batches/${state.batchId}/review`));
      if (gate(el, res, key)) return;
      const queue = (res.data.items || []).filter(matchesPhaseRegion);
      window.__reviewItems = queue;

      let html = `
        <div class="alert-banner info">
          <div class="alert-banner-left">
            ${iconSvg("inbox", 18)}
            <span><strong>Only people we couldn't match automatically</strong> (by email, a typo-fixed email, phone, or a full name only one learner has). Confirm once and it's remembered for every future sync.</span>
          </div>
          <span class="badge badge-amber">${fmtNum(queue.length)} awaiting review</span>
        </div>
      `;

      if (!queue.length) {
        html += `
          <div class="empty-state">
            <div class="empty-icon">${iconSvg("check", 22)}</div>
            <h2 style="margin:0;font-size:16px;">Review Queue is clear</h2>
            <p style="margin:0;color:var(--text-muted);">No unmatched Zoom participants in this batch${state.phase !== "All" || state.region !== "All" ? " for the current phase/region filter" : ""}.</p>
          </div>
        `;
        el.innerHTML = html;
        return;
      }

      const reviewPg = pageOf(queue, state.reviewLimit, REVIEW_PAGE);
      html += pagerHtml(queue.length, reviewPg, REVIEW_PAGE, "gotoReviewPage");
      html += `<div class="review-grid">`;
      reviewPg.rows.forEach((item, i) => {
        const idx = reviewPg.start + i;
        const st = state.reviewSearch[item.id];
        const busy = state.reviewBusy.has(item.id);
        const suggestions = item.suggestions || [];
        html += `
          <div class="review-card" ${busy ? `aria-busy="true"` : ""}>
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
              <div style="min-width:0;">
                <h3 style="margin:0;font-size:15px;word-break:break-word;">${esc(item.zoomName)}</h3>
                <div style="font-size:12.5px;color:var(--text-muted);margin-top:2px;">
                  ${esc(item.zoomEmail || "No Zoom email")}${item.phone ? ` · ${esc(item.phone)}` : ""} · ${esc(item.phase)} · ${esc(item.region || "Unknown")}
                </div>
                <div style="font-size:11.5px;color:var(--text-muted);">Last seen ${esc(fmtDate(item.lastSeen))}</div>
              </div>
              <span class="badge badge-slate tabular">${fmtNum(item.sessionsSeen)} sessions · ${fmtNum(item.totalMinutes)}m</span>
            </div>

            <div style="display:flex;flex-direction:column;gap:6px;">
              <div style="font-size:11.5px;font-weight:600;color:var(--text-muted);">Suggested learners</div>
              ${suggestions.length ? suggestions.map(sg => `
                <div class="suggestion-row">
                  <div style="min-width:0;">
                    <div style="font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(sg.name)}</div>
                    <div style="font-size:11.5px;color:var(--text-muted);">${fmtNum(sg.confidence)}% confidence · ${esc(sg.reason)}</div>
                    ${sg.email || sg.phone ? `<div style="font-size:11.5px;color:var(--text-muted);">${esc([sg.phone, sg.email].filter(Boolean).join(" · "))}</div>` : ""}
                  </div>
                  <button class="btn btn-primary btn-sm" ${busy ? "disabled" : ""} onclick="resolveReview(${idx}, 'match', ${Number(sg.learnerId)})">Confirm</button>
                </div>
              `).join("") : `
                <div style="font-size:12px;color:var(--text-muted);padding:8px 10px;border:1px dashed var(--border-subtle);border-radius:6px;">
                  No confident suggestions — search below.
                </div>
              `}
            </div>

            <div style="display:flex;flex-direction:column;gap:8px;padding-top:8px;border-top:1px solid var(--border-subtle);">
              <div style="position:relative;">
                <label class="visually-hidden" for="review-search-${idx}">Match ${esc(item.zoomName)} to a learner</label>
                <input
                  type="search"
                  class="search-input"
                  style="width:100%;"
                  id="review-search-${idx}"
                  placeholder="Match to… search name, email, or phone"
                  value="${esc(st ? st.q : "")}"
                  autocomplete="off"
                  oninput="reviewSearchInput(${idx}, this.value)"
                />
                <div id="review-results-${idx}">${reviewResultsHtml(idx, item)}</div>
              </div>
              <div style="display:flex;gap:8px;justify-content:flex-end;align-items:center;">
                ${busy ? `<span style="font-size:12px;color:var(--text-muted);"><span class="spinner" aria-hidden="true"></span> Saving…</span>` : ""}
                <button class="btn btn-sm" ${busy ? "disabled" : ""} onclick="resolveReview(${idx}, 'not_learner')">Not a learner</button>
                <button class="btn btn-sm" ${busy ? "disabled" : ""} onclick="resolveReview(${idx}, 'skip')">Skip</button>
              </div>
            </div>
          </div>
        `;
      });
      html += `</div>`;
      html += pagerHtml(queue.length, reviewPg, REVIEW_PAGE, "gotoReviewPage");

      el.innerHTML = html;
    }


    /* =========================================================================
       13. SCREEN: SYNC & ALERTS (#/sync) — Admin
       ========================================================================= */
    function renderSyncAlerts(el, ctx) {
      const key = "sync";
      const res = need(key, () => getJSON("/api/sync"));
      if (gate(el, res, key)) return;
      const sync = res.data;
      const sources = sync.sources || [];
      const alerts = sync.alerts || [];
      const logs = sync.logs || [];
      // Settings (Admin) gives the TagMango webhook URL — optional, the page works without it.
      const settingsRes = need("settings", () => getJSON("/api/settings"));
      const tm = settingsRes.data ? settingsRes.data.tagmango : null;
      const sourceName = s => {
        const src = sources.find(x => x.id === s || x.name === s);
        return src ? src.name : s;
      };

      const card = src => {
        const kind = src.id === "tagmango" ? "tagmango" : "zoom";
        const running = state.syncRunning[kind] || src.status === "Running";
        const disabled = running || src.connected === false;
        const isTm = kind === "tagmango";
        const imp = state.importResult;
        return `
          <div class="card" style="display:flex;flex-direction:column;justify-content:space-between;gap:14px;">
            <div>
              <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px;">
                <div style="min-width:0;">
                  <h3 class="card-title">${esc(src.name)}</h3>
                  ${src.account && src.account !== src.name ? `<div style="font-size:12px;color:var(--text-muted);">${esc(src.account)}</div>` : ""}
                </div>
                ${statusBadge(running ? "Running" : src.status)}
              </div>
              <div style="font-size:12.5px;color:var(--text-secondary);">${esc(src.type)}</div>
              ${src.connected === false ? `<div style="margin-top:8px;font-size:12px;color:var(--text-muted);">Credentials aren't configured on the server for this source.</div>` : ""}
              ${src.errorMsg ? `
                <div style="margin-top:10px;padding:8px 10px;border-radius:8px;background:var(--red-bg);color:var(--red);font-size:12px;word-break:break-word;">
                  ${esc(src.errorMsg)}
                </div>
              ` : ""}
              ${isTm ? `
                <div style="margin-top:10px;font-size:12px;color:var(--text-muted);display:flex;flex-direction:column;gap:6px;">
                  ${tm && tm.webhookUrl ? `
                    <div>Webhook URL</div>
                    <div style="display:flex;gap:6px;align-items:center;">
                      <code class="code-box" title="${esc(tm.webhookUrl)}">${esc(tm.webhookUrl)}</code>
                      <button class="btn btn-sm" onclick="copyWebhookUrl()" aria-label="Copy webhook URL">${iconSvg("copy", 13)}</button>
                    </div>` : (tm ? `<div>Webhook URL not configured on the server (PUBLIC_URL / webhook secret).</div>` : "")}
                </div>
                ${imp ? `
                  <div class="import-result ${imp.error ? "is-error" : ""}" role="status">
                    ${imp.error
                      ? `<strong>Import failed:</strong> ${esc(imp.error)}`
                      : `<strong>${esc(imp.fileName)}</strong>: ${fmtNum(imp.inserted)} new · ${fmtNum(imp.updated)} updated · ${fmtNum(imp.skipped)} skipped
                         ${imp.errors && imp.errors.length ? `<ul style="margin:6px 0 0 16px;padding:0;">${imp.errors.slice(0, 5).map(e => `<li>${esc(typeof e === "string" ? e : (e && (e.message || e.error)) || JSON.stringify(e))}</li>`).join("")}</ul>${imp.errors.length > 5 ? `<div>…and ${fmtNum(imp.errors.length - 5)} more</div>` : ""}` : ""}`}
                  </div>` : ""}
              ` : ""}
            </div>
            <div style="border-top:1px solid var(--border-subtle);padding-top:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
              <div style="font-size:12px;color:var(--text-muted);">
                <div>Last sync: <strong data-reltime="${esc(src.lastSyncIso || "")}" title="${esc(fmtIstDateTime(src.lastSyncIso))}">${esc(src.lastSyncIso ? relTime(src.lastSyncIso) : "Never")}</strong></div>
                <div class="tabular">Records: <strong>${fmtNum(src.recordsPulled)}</strong>${src.nextRunIso ? ` · Next: ${esc(relTime(src.nextRunIso))}` : ""}</div>
              </div>
              <div style="display:flex;gap:6px;flex-wrap:wrap;">
                ${isTm ? `
                  <input type="file" id="tm-import-file" accept=".csv,text/csv" class="visually-hidden" onchange="importLearnersCsv(this)" tabindex="-1" aria-hidden="true" />
                  <button class="btn btn-sm" ${state.importBusy ? "disabled" : ""} onclick="document.getElementById('tm-import-file').click()">

    function summarizeSyncResults(results, boot) {
      if (!results) return { text: "Sync finished", error: false };
      if (results.skipped === true) return { text: results.reason || "A sync is already running", error: false };
      const parts = [];
      let error = false;
      const z = results.zoom;
      if (z) {
        if (z.skipped === true) parts.push("A sync is already running");
        else if (Array.isArray(z)) {
          if (!z.length) parts.push("Zoom: no connected accounts");
          z.forEach(r => {
            const name = accountLabel(boot, r.account);
            parts.push(`${name}: ${r.status} · ${fmtNum(r.records)} records`);
            if (r.status !== "Synced") error = true;
          });
        }
      }
      const t = results.tagmango;
      if (t) {
        if (t.error) { parts.push(`TagMango: ${t.error}`); error = true; }
        else if (t.skipped === true) parts.push(`TagMango: ${t.reason || "skipped"}`);
        else if (t.recent) parts.push(`TagMango: ${fmtNum(t.recent.saved)} recent learners updated`);
        else parts.push(`TagMango: ${fmtNum(t.inserted)} new · ${fmtNum(t.updated)} updated · ${fmtNum(t.skipped)} skipped`);
      }
      return { text: parts.join(" · ") || "Sync finished", error };
    }

    let lastRouteKey = null;

    /** Clears inputs by id (looked up fresh — the DOM may have been re-rendered while a write was in flight). */
    function clearFields(...ids) {
      ids.forEach(id => { const e = document.getElementById(id); if (e) e.value = ""; });
    }

    function snapshotUi() {
      const root = document.getElementById("app");
      if (!root) return null;
      const fields = {};
      root.querySelectorAll("[data-keep]").forEach(elx => {
        if (!elx.id) return;
        fields[elx.id] = elx.type === "checkbox" ? { checked: elx.checked } : { value: elx.value };
      });
      let focus = null;
      const a = document.activeElement;
      if (a && a.id && root.contains(a)) {
        focus = { id: a.id, start: null, end: null };
        try { focus.start = a.selectionStart; focus.end = a.selectionEnd; } catch (_) { /* not a text input */ }
      }
      return { fields, focus, scrollY: pageScroller().scrollTop };
    }

    // The content column is the scroll container (sidebar and top bar stay fixed)
    function pageScroller() {
      return document.querySelector(".main-column") || document.scrollingElement || document.documentElement;
    }

    function restoreUi(snap) {
      if (!snap) return;
      Object.entries(snap.fields).forEach(([id, v]) => {
        const elx = document.getElementById(id);
        if (!elx || !elx.hasAttribute("data-keep")) return;
        if ("checked" in v) elx.checked = v.checked;
        else elx.value = v.value;
      });
      if (snap.focus) {
        const elx = document.getElementById(snap.focus.id);
        if (elx && !elx.disabled) {
          try { elx.focus({ preventScroll: true }); } catch (_) { elx.focus(); }
          if (snap.focus.start != null) { try { elx.setSelectionRange(snap.focus.start, snap.focus.end); } catch (_) { /* not supported */ } }
        }
      }
      const sc = pageScroller();
      if (Math.abs(sc.scrollTop - snap.scrollY) > 1) sc.scrollTop = snap.scrollY;
    }

    function render() {
      const app = document.getElementById("app");

      if (state.authRequired) {
        const snap = lastRouteKey === "login" ? snapshotUi() : null;
        destroyCharts();
        app.innerHTML = renderLogin();
        restoreUi(snap);
        if (lastRouteKey !== "login") {
          const em = document.getElementById("login-email");
          if (em) em.focus();
        }
        lastRouteKey = "login";
        return;
      }

      const b = need("bootstrap", () => getJSON("/api/bootstrap"));
      if (!b.data) {
        destroyCharts();
        app.innerHTML = b.error ? renderFatal(b.error) : renderSplash();
        lastRouteKey = "splash";
        return;
      }
      const boot = b.data;
      state.user = boot.user || state.user;

      const ids = (boot.batches || []).map(x => x.id);
      if (!ids.includes(state.batchId)) state.batchId = boot.defaultBatchId != null && ids.includes(boot.defaultBatchId) ? boot.defaultBatchId : (ids[0] ?? null);

      let { screen, param } = getRoute();
      const allowed = allowedScreens();
      if (!allowed.length) {
        destroyCharts();
        app.innerHTML = `<div class="login-wrap">${renderForbiddenCard()}<button class="btn" style="margin-top:12px;" onclick="signOut()">Sign out</button></div>`;
        lastRouteKey = "noaccess";
        return;
      }
      if (!allowed.includes(screen)) {
        // Unknown or not-permitted route → the role's first page (the API's 403 card covers the rest).
        window.location.hash = `#/${allowed[0]}`;
        return;
      }

      const routeKey = `${window.location.hash}|${state.batchId}`;
      const snap = routeKey === lastRouteKey ? snapshotUi() : null;
      destroyCharts();
      app.innerHTML = renderShell(boot, screen);
      const contentEl = document.getElementById("screen-content");
      const ctx = { boot, param };

      if (screen === "overview") renderOverview(contentEl, ctx);
      else if (screen === "sessions") renderSessions(contentEl, ctx);
      else if (screen === "session") renderSessionDetail(contentEl, ctx);
      else if (screen === "learners") renderLearners(contentEl, ctx);
      else if (screen === "learner") renderLearnerProfile(contentEl, ctx);
      else if (screen === "lists") renderLists(contentEl, ctx);
      else if (screen === "review") renderReviewQueue(contentEl, ctx);
      else if (screen === "sync") renderSyncAlerts(contentEl, ctx);
      else if (screen === "settings") renderSettings(contentEl, ctx);

      restoreUi(snap);
      if (state.focusAfterRender) {
        const f = document.getElementById(state.focusAfterRender);
        if (f) { state.focusAfterRender = null; f.focus(); f.scrollIntoView({ block: "center" }); }
      }
      lastRouteKey = routeKey;
    }

      // ----- Call logging -----
      async openCallDialog(learnerId, batchId, phase) {
        const rows = (window.__currentListData && window.__currentListData.rows) || [];
        const l = rows.find(r => Number(r.id) === Number(learnerId)) || {};
        if (!window.__callOptions) {

        let d = document.getElementById("call-dialog");

        const me = (state.user && (state.user.name || state.user.email)) || "you";
        d.innerHTML = `
          <form class="call-form" method="dialog" onsubmit="event.preventDefault(); saveCall(${Number(learnerId)}, ${batchId == null ? "null" : Number(batchId)}, '${esc(phase || "")}')">
            <div>
              <h2>Log a call</h2>
              <div style="font-size:13px;color:var(--text-muted);margin-top:4px;">${esc(l.name || "Learner")} · ${esc(l.phone || "no phone")} · caller: ${esc(me)}</div>

              </select>
            </div>
            <div class="field-group">
              <label class="field-label" for="call-reason">Reason they gave (optional)</label>
              <select id="call-reason" class="select-control"><option value="">—</option>${o.reasons.map(x => `<option>${esc(x)}</option>`).join("")}</select>
            </div>
            <div class="field-group">
              <label class="field-label" for="call-follow">Next follow-up (optional)</label>
              <input id="call-follow" type="date" class="input-control" />
            </div>
            <div class="field-group">
              <label class="field-label" for="call-note">Note (optional)</label>
              <textarea id="call-note" class="input-control" maxlength="1000" placeholder="What they said"></textarea>

            <div class="form-msg is-error" id="call-error" role="alert"></div>

            </div>
          </form>`;
        d.showModal();
